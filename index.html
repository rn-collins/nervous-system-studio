<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Nervous System Studio helps you design sensory environments and daily routines that support calm, focus, creativity, and sleep. Built by RN Collins." />
<meta property="og:title" content="Nervous System Studio — Design your environment around your nervous system | RN Collins" />
<meta property="og:description" content="Nervous System Studio helps you design sensory environments and daily routines that support calm, focus, creativity, and sleep. Built by RN Collins." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://nervous-system-studio.vercel.app" />
<meta name="theme-color" content="#f6f2ec" />
<title>Nervous System Studio — Design your environment around your nervous system</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
<style>
:root{
  /* Warm off-white + soft neutrals + muted earth tones */
  --bg:            #f6f2ec;   /* warm off-white */
  --surface:       #fffdf9;   /* card surface */
  --surface-2:     #f0eae1;   /* subtle raised */
  --ink:           #2f2a24;   /* near-black warm, strong contrast on bg */
  --ink-soft:      #5a5148;   /* secondary text, AA on bg */
  --line:          #e2d9cc;   /* hairline */
  --clay:          #9c6b4e;   /* muted terracotta accent */
  --clay-deep:     #7d5238;   /* darker accent for text/contrast */
  --sage:          #6f7d63;   /* muted sage */
  --sage-deep:     #55604b;
  --sand:          #cdbfa8;
  --focus:         #3f5d78;   /* accessible focus ring (blue-slate) */
  --danger:        #8a3b34;
  --radius:        18px;
  --radius-sm:     12px;
  --shadow:        0 1px 2px rgba(47,42,36,.04), 0 8px 28px rgba(47,42,36,.06);
  --maxw:          1080px;
  --font: 'Georgia', 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font); font-weight:600; line-height:1.2; color:var(--ink); margin:0 0 .5em}
h1{font-size:2.1rem; letter-spacing:-.01em}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:0 0 1em}
a{color:var(--clay-deep)}
img{max-width:100%}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
.narrow{max-width:680px; margin:0 auto; padding:0 20px}

/* Accessibility: visible focus everywhere */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible, .chip:focus-visible{
  outline:3px solid var(--focus); outline-offset:2px; border-radius:6px;
}
.skip{position:absolute; left:-999px; top:0; background:var(--ink); color:#fff; padding:10px 16px; z-index:100; border-radius:0 0 8px 0}
.skip:focus{left:0}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  font-family:var(--sans); font-size:1rem; font-weight:600; cursor:pointer;
  padding:13px 22px; border-radius:999px; border:1.5px solid transparent;
  text-decoration:none; transition:background .15s, border-color .15s, transform .05s; min-height:48px;
}
@media (prefers-reduced-motion: reduce){ .btn{transition:none} *{scroll-behavior:auto !important} }
.btn-primary{background:var(--clay-deep); color:#fff}
.btn-primary:hover{background:#6a4530}
.btn-secondary{background:transparent; color:var(--ink); border-color:var(--sand)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent; color:var(--clay-deep); padding:10px 14px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* Header / nav */
header.site{position:sticky; top:0; z-index:40; background:rgba(246,242,236,.9); backdrop-filter:saturate(1.1) blur(8px); border-bottom:1px solid var(--line)}
.nav{display:flex; align-items:center; gap:16px; height:64px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-family:var(--font); font-weight:600; font-size:1.1rem}
.brand .mark{width:26px; height:26px; flex:none}
.nav .spacer{flex:1}
.nav-links{display:flex; align-items:center; gap:6px}
.nav-links a{color:var(--ink-soft); text-decoration:none; padding:8px 12px; border-radius:8px; font-size:.95rem; font-weight:600}
.nav-links a:hover{background:var(--surface-2); color:var(--ink)}
.nav-links a[aria-current="page"]{color:var(--clay-deep); background:var(--surface-2)}
.menu-toggle{display:none; background:transparent; border:1.5px solid var(--sand); border-radius:10px; padding:8px 10px; cursor:pointer; min-height:44px}
@media (max-width:860px){
  .nav-links{position:fixed; inset:64px 0 auto 0; background:var(--surface); flex-direction:column; align-items:stretch; padding:12px 16px; border-bottom:1px solid var(--line); gap:2px; box-shadow:var(--shadow)}
  .nav-links[hidden]{display:none}
  .nav-links a{padding:12px 10px}
  .menu-toggle{display:inline-flex}
}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.grid{display:grid; gap:16px}
@media (min-width:720px){ .grid.cols-2{grid-template-columns:1fr 1fr} .grid.cols-3{grid-template-columns:repeat(3,1fr)} .grid.cols-4{grid-template-columns:repeat(4,1fr)} }
.eyebrow{font-family:var(--sans); text-transform:uppercase; letter-spacing:.14em; font-size:.72rem; font-weight:700; color:var(--clay); margin-bottom:12px}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}
.pill{display:inline-block; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); border-radius:999px; padding:4px 12px; font-size:.82rem; font-weight:600; margin:0 6px 6px 0}
.section{padding:64px 0}
.section.tight{padding:40px 0}
.center{text-align:center}
.hr{height:1px; background:var(--line); border:0; margin:32px 0}

/* Forms */
label.field{display:block; margin-bottom:18px}
label.field > .lab{display:block; font-weight:600; margin-bottom:6px; font-size:.95rem}
label.field .hint{font-weight:400; color:var(--ink-soft); font-size:.85rem}
input[type=text], input[type=email], input[type=date], input[type=time], input[type=number], select, textarea{
  width:100%; font-family:var(--sans); font-size:1rem; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--sand); border-radius:var(--radius-sm);
  padding:12px 14px; min-height:48px;
}
textarea{min-height:110px; resize:vertical}
.choices{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
.chip{display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--sand); border-radius:999px; padding:10px 16px; cursor:pointer; font-size:.95rem; font-weight:600; color:var(--ink); min-height:44px}
.chip input{position:absolute; opacity:0; width:1px; height:1px}
.chip[data-on="true"]{background:var(--sage-deep); border-color:var(--sage-deep); color:#fff}
.chip .tick{opacity:0}
.chip[data-on="true"] .tick{opacity:1}
fieldset{border:0; padding:0; margin:0 0 18px}
legend{font-weight:600; margin-bottom:8px; padding:0; font-size:.95rem}

/* Range/scores */
.scorerow{display:grid; grid-template-columns:1fr; gap:6px; margin-bottom:16px}
.scorerow .top{display:flex; justify-content:space-between; align-items:baseline}
.scorerow output{font-weight:700; color:var(--clay-deep); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--sage-deep); min-height:32px}

/* Dashboard layout */
.app-shell{display:block}
.metric{display:flex; flex-direction:column; gap:4px}
.metric .n{font-family:var(--font); font-size:2rem; color:var(--clay-deep)}
.metric .l{font-size:.85rem; color:var(--ink-soft); font-weight:600}

/* Bars for insights */
.bar{height:10px; background:var(--surface-2); border-radius:999px; overflow:hidden; border:1px solid var(--line)}
.bar > span{display:block; height:100%; background:var(--sage-deep)}

/* Log list */
.logitem{display:flex; gap:14px; align-items:flex-start; padding:16px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface)}
.logitem + .logitem{margin-top:10px}
.logitem .tag{font-size:.78rem; font-weight:700; color:var(--sage-deep)}

/* Empty state */
.empty{text-align:center; padding:40px 20px; border:1.5px dashed var(--sand); border-radius:var(--radius); background:var(--surface)}
.empty .em-ic{width:44px; height:44px; margin:0 auto 12px; color:var(--clay)}

/* Toast */
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; box-shadow:var(--shadow); z-index:80; font-size:.95rem}
#toast[hidden]{display:none}

/* Footer */
footer.site{border-top:1px solid var(--line); background:var(--surface); margin-top:48px}
footer.site .cols{display:grid; gap:24px; padding:40px 0}
@media(min-width:720px){ footer.site .cols{grid-template-columns:2fr 1fr 1fr} }
footer.site a{display:block; color:var(--ink-soft); text-decoration:none; padding:4px 0; font-size:.92rem}
footer.site a:hover{color:var(--ink)}
.disclaimer-band{background:var(--surface-2); border-top:1px solid var(--line); font-size:.82rem; color:var(--ink-soft)}
.disclaimer-band .wrap{padding:16px 20px}

/* Hero */
.hero{padding:72px 0 48px}
.hero h1{font-size:2.6rem; max-width:16ch}
.hero p.sub{font-size:1.15rem; color:var(--ink-soft); max-width:60ch}
.hero .ctas{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
@media(min-width:900px){ .hero h1{font-size:3.2rem} }

/* progress */
.progress{height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:24px}
.progress > span{display:block; height:100%; background:var(--clay); transition:width .2s}
@media (prefers-reduced-motion: reduce){ .progress>span{transition:none} }

.stepdots{font-size:.85rem; color:var(--ink-soft); font-weight:600; margin-bottom:8px}
.blueprint-h{display:flex; align-items:center; gap:12px; margin-bottom:4px}
.bp-ic{width:30px;height:30px;flex:none;color:var(--sage-deep)}
dl.bp{margin:0}
dl.bp dt{font-weight:700; margin-top:14px; font-size:.9rem; text-transform:uppercase; letter-spacing:.06em; color:var(--clay)}
dl.bp dd{margin:2px 0 0}
.avoid{color:var(--danger)}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
.tab{background:var(--surface); border:1.5px solid var(--sand); border-radius:999px; padding:8px 16px; font-weight:600; cursor:pointer; min-height:44px}
.tab[aria-selected="true"]{background:var(--clay-deep); color:#fff; border-color:var(--clay-deep)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* =====================================================================
   PREMIUM LAYER — elevated typography, color, components, motion
   (cascades over the base styles above)
   ===================================================================== */
:root{
  --bg:#f5f1ea;
  --bg-2:#efe8dd;
  --surface:#fffef9;
  --surface-2:#efe7db;
  --ink:#2a2521;
  --ink-soft:#5c5349;
  --ink-faint:#867a6c;
  --line:#e6ddce;
  --line-strong:#d8ccb8;
  --clay:#a06a49;
  --clay-deep:#7a4d30;
  --clay-wash:#f3e7dc;
  --sage:#68765b;
  --sage-deep:#4e5a44;
  --sage-wash:#e9ece1;
  --sand:#c9baa1;
  --gold:#b98d3e;
  --focus:#355a7a;
  --danger:#8a3b34;
  --radius:20px;
  --radius-sm:14px;
  --radius-lg:28px;
  --shadow-sm:0 1px 2px rgba(42,37,33,.05), 0 4px 14px rgba(42,37,33,.05);
  --shadow:0 2px 6px rgba(42,37,33,.05), 0 18px 44px rgba(42,37,33,.09);
  --shadow-lg:0 30px 70px rgba(42,37,33,.14);
  --maxw:1120px;
  --serif:'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font:var(--serif);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{font-family:var(--sans); color:var(--ink); background:var(--bg); font-size:17px; line-height:1.62; letter-spacing:-.002em}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:-.02em; color:var(--ink)}
h1{font-size:clamp(2.1rem,5.2vw,3.4rem); line-height:1.06}
h2{font-size:clamp(1.6rem,3.6vw,2.35rem); line-height:1.12}
h3{font-size:1.25rem; letter-spacing:-.01em}
.wrap{max-width:var(--maxw)}
.narrow{max-width:720px}
.reading{max-width:660px; margin:0 auto; padding:0 20px}
.eyebrow{color:var(--clay); font-family:var(--sans); font-weight:700; font-size:.74rem; letter-spacing:.16em}
.lede{font-size:1.2rem; color:var(--ink-soft); line-height:1.55; max-width:60ch}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.section{padding:clamp(52px,8vw,104px) 0}
.section.tight{padding:clamp(36px,5vw,60px) 0}
.section-alt{background:linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);border:0;margin:0}
.center{text-align:center}
.stack-sm > * + *{margin-top:10px}

/* ---- Buttons: refined ---- */
.btn{font-family:var(--sans); font-weight:600; font-size:1rem; border-radius:999px; padding:14px 26px; min-height:52px; letter-spacing:.01em; box-shadow:none; position:relative; transition:transform .16s ease, background .16s, border-color .16s, box-shadow .16s}
.btn-primary{background:var(--clay-deep); color:#fff; box-shadow:0 8px 20px rgba(122,77,48,.22)}
.btn-primary:hover{background:#673f27; box-shadow:0 12px 26px rgba(122,77,48,.28)}
.btn-secondary{background:var(--surface); border-color:var(--line-strong); color:var(--ink)}
.btn-secondary:hover{background:var(--surface-2); border-color:var(--sand)}
.btn-lg{padding:16px 30px; min-height:56px; font-size:1.05rem}
.btn:not(.btn-block):hover{transform:translateY(-1px)}
@media (prefers-reduced-motion: reduce){ .btn:hover{transform:none} }
.btn svg{width:20px;height:20px}

/* ---- Header / nav: refined ---- */
header.site{background:rgba(245,241,234,.82); backdrop-filter:saturate(1.2) blur(12px); border-bottom:1px solid rgba(230,221,206,.7)}
.nav{height:72px; gap:20px}
.brand{font-family:var(--serif); font-size:1.12rem; letter-spacing:-.02em; gap:11px}
.brand .mark{width:30px;height:30px}
.nav-links{gap:2px}
.nav-links a{font-family:var(--sans); font-weight:500; font-size:.95rem; color:var(--ink-soft); padding:9px 13px; border-radius:10px}
.nav-links a:hover{color:var(--ink); background:rgba(233,224,209,.6)}
.nav-links a[aria-current="page"]{color:var(--clay-deep); background:transparent; font-weight:600}
.nav-links a.nav-cta{background:var(--clay-deep); color:#fff; font-weight:600; padding:10px 18px; margin-left:6px; box-shadow:0 6px 16px rgba(122,77,48,.2)}
.nav-links a.nav-cta:hover{background:#673f27; color:#fff}
@media(max-width:860px){
  .nav-links{gap:2px; padding:14px 16px 20px; box-shadow:var(--shadow)}
  .nav-links a{padding:13px 12px; font-size:1rem; border-bottom:1px solid var(--line)}
  .nav-links a:last-child{border-bottom:0}
  .nav-links a.nav-cta{margin:10px 0 0; text-align:center; border-bottom:0}
}
.menu-toggle{border-color:var(--line-strong); border-radius:12px; font-weight:600; color:var(--ink); gap:8px}

/* ---- Cards: refined + interactive ---- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow-sm)}
.card + .card{margin-top:18px}
a.card, .card-link{display:block; text-decoration:none; color:inherit; transition:transform .18s ease, box-shadow .18s, border-color .18s}
a.card:hover, .card-link:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--line-strong)}
@media (prefers-reduced-motion: reduce){ a.card:hover,.card-link:hover{transform:none} }
.card-pad-lg{padding:clamp(28px,4vw,44px)}
.grid{gap:20px}

/* ---- Icon medallion ---- */
.medallion{width:52px;height:52px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;background:var(--clay-wash);color:var(--clay-deep);flex:none;border:1px solid var(--line)}
.medallion.sage{background:var(--sage-wash);color:var(--sage-deep)}
.medallion svg{width:26px;height:26px}

/* ---- Hero ---- */
.hero{position:relative; padding:clamp(56px,9vw,108px) 0 clamp(40px,6vw,72px); overflow:hidden}
.hero::before{content:""; position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(60% 55% at 80% 8%, rgba(160,106,73,.10), transparent 60%),
    radial-gradient(50% 50% at 8% 90%, rgba(104,118,91,.10), transparent 60%);
}
.hero .kicker{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px 7px 12px;font-size:.8rem;font-weight:600;color:var(--ink-soft);box-shadow:var(--shadow-sm);margin-bottom:22px}
.hero .kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--sage);flex:none}
.hero h1{max-width:17ch; margin-bottom:20px}
.hero .sub{font-size:clamp(1.08rem,2vw,1.28rem); color:var(--ink-soft); max-width:56ch; line-height:1.5}
.hero .ctas{margin-top:30px; gap:14px}
.hero .reassure{margin-top:22px; display:flex; flex-wrap:wrap; gap:8px 20px; font-size:.9rem; color:var(--ink-faint)}
.hero .reassure span{display:inline-flex;align-items:center;gap:7px}
.hero .reassure svg{width:16px;height:16px;color:var(--sage-deep);flex:none}

/* ---- Preview panel in hero ---- */
.previewcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-lg)}
.previewcard .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.previewcard .row:last-child{border-bottom:0}
.mini-bar{height:8px;width:120px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.mini-bar > span{display:block;height:100%;background:var(--sage-deep)}

/* ---- Steps ---- */
.step{position:relative; padding-left:0}
.step .num{font-family:var(--serif); font-size:1.05rem; font-weight:600; width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--clay-deep);color:#fff;margin-bottom:14px}
.step h3{margin-bottom:6px}

/* ---- Audience cards ---- */
.aud{display:flex;gap:14px;align-items:flex-start}
.aud .medallion{width:44px;height:44px;border-radius:12px}
.aud .medallion svg{width:22px;height:22px}

/* ---- Quote / testimonial ---- */
.quote{font-family:var(--serif); font-size:clamp(1.4rem,3vw,2rem); line-height:1.32; color:var(--ink); letter-spacing:-.02em}
.quote-source{margin-top:14px; font-size:.92rem; color:var(--ink-faint); font-weight:600}

/* ---- Stat band ---- */
.band{background:var(--sage-deep); color:#fdfbf6; border-radius:var(--radius-lg); padding:clamp(32px,5vw,56px)}
.band h2{color:#fff}
.band .muted{color:rgba(255,255,255,.82)}
.band .btn-secondary{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28); color:#fff}
.band .btn-secondary:hover{background:rgba(255,255,255,.2)}
.band a{color:#fff}

/* ---- FAQ accordion ---- */
.faq{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{list-style:none; cursor:pointer; padding:20px 24px; font-weight:600; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; gap:16px; color:var(--ink); min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--surface-2)}
.faq summary .chev{flex:none; transition:transform .2s; color:var(--clay); font-size:1.4rem; line-height:1}
@media (prefers-reduced-motion: reduce){ .faq summary .chev{transition:none} }
.faq details[open] summary .chev{transform:rotate(45deg)}
.faq .ans{padding:0 24px 22px; color:var(--ink-soft); max-width:70ch}
.faq .ans p:last-child{margin-bottom:0}

/* ---- Pills / badges ---- */
.pill{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); font-weight:600; padding:5px 13px}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--sage-wash);border:1px solid var(--line);color:var(--sage-deep);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:600}

<script>
"use strict";
/* ============================================================
   Nervous System Studio — V1
   Single-file app. Client-side router + localStorage store.
   ============================================================ */

/* ---------- DATA MODEL ----------
   store schema (localStorage key: 'nss.v1'):
   {
     user: { id, name, email, createdAt } | null,
     waitlist: [ { email, createdAt } ],
     sensoryProfile: {              // one per user
        desiredStates:[], sensitivities:[], helpfulInputs:[],
        aesthetics:[], cannabisUse:'none|current|curious',
        cannabisGoals:[], productFormats:[], updatedAt
     } | null,
     environments: [ { id, name } ],   // reusable room presets (derived)
     routines: [ { id, name } ],
     products: [ { id, label, format } ],
     logs: [ { id, ...fields, scores:{...}, createdAt } ],
     insights: [ derived at runtime ],
     blueprints: derived at runtime
   }
--------------------------------------------------------------- */

const LS_KEY = 'nss.v1';
const uid = () => Math.random().toString(36).slice(2,9);

const DEFAULT_STATE = {
  user:null, waitlist:[], sensoryProfile:null,
  environments:[], routines:[], products:[], logs:[]
};

function load(){
  try{ const raw = localStorage.getItem(LS_KEY); return raw ? Object.assign({}, DEFAULT_STATE, JSON.parse(raw)) : structuredCloneSafe(DEFAULT_STATE); }
  catch(e){ return structuredCloneSafe(DEFAULT_STATE); }
}
function structuredCloneSafe(o){ return JSON.parse(JSON.stringify(o)); }
let STATE = load();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){ toast('Storage unavailable in this browser.'); } }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(()=>{ t.hidden = true; }, 2800);
}
function fmtDate(iso){
  try{
    // Parse date-only strings (YYYY-MM-DD) as LOCAL dates to avoid a UTC
    // off-by-one where e.g. "2026-07-18" renders as Jul 17 in negative-UTC zones.
    let d;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    if(m){ d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3])); }
    else { d = new Date(iso); }
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }catch(e){ return iso; }
}
function fmtTime(t){ return t || ''; }
function isLoggedIn(){ return !!STATE.user; }
function hasProfile(){ return !!STATE.sensoryProfile; }

function layout(inner, opts={}){
  return header() + `<main id="main" tabindex="-1">${inner}</main>` + footer();
}

function render(){
  const {name, parts} = currentRoute();
  // guard app routes
  if(APP_ROUTES.includes(name) && !isLoggedIn()){
    document.getElementById('app').innerHTML = layout(views.gate());
    afterRender(); return;
  }
  const fn = views[name] || views.notfound;
  document.getElementById('app').innerHTML = layout(fn(parts));
  window.scrollTo(0,0);
  afterRender();
}

/* wire up dynamic behaviours after each render */
function afterRender(){
  // mobile menu
  const mb = document.getElementById('menuBtn');
  const nl = document.getElementById('navlinks');
  if(mb && nl){
    const isMobile = ()=> window.matchMedia('(max-width:860px)').matches;
    if(isMobile()) nl.hidden = true; else nl.hidden = false;
    mb.onclick = ()=>{ const open = nl.hidden; nl.hidden = !open; mb.setAttribute('aria-expanded', String(open)); };
    window.onresize = ()=>{ if(!isMobile()) nl.hidden=false; else if(mb.getAttribute('aria-expanded')!=='true') nl.hidden=true; };
  }
  // chips (multi/single select)
  document.querySelectorAll('.chip input').forEach(inp=>{
    const chip = inp.closest('.chip');
    chip.setAttribute('data-on', String(inp.checked));
    inp.addEventListener('change', ()=>{
      if(inp.type==='radio'){
        document.querySelectorAll(`.chip input[name="${CSS.escape(inp.name)}"]`).forEach(o=>o.closest('.chip').setAttribute('data-on', String(o.checked)));
      } else {
        chip.setAttribute('data-on', String(inp.checked));
      }
    });
  });
  // range live output
  document.querySelectorAll('input[type=range]').forEach(rg=>{
    const out = document.getElementById(rg.id+'-out');
    if(out){ const upd=()=> out.textContent = rg.value; rg.addEventListener('input', upd); upd(); }
  });
  // waitlist form
  const wf = document.getElementById('waitForm');
  if(wf){
    wf.addEventListener('submit', (e)=>{
      e.preventDefault();
      const email = document.getElementById('wl-email').value.trim();
      const err = document.getElementById('wl-email-err');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Please enter a valid email address.'; document.getElementById('wl-email').focus(); return; }
      err.textContent='';
      if(!STATE.waitlist.some(w=>w.email===email)) STATE.waitlist.push({email, createdAt:new Date().toISOString()});
      save();
      wf.closest('.narrow').querySelector('.card').innerHTML =
        `<div class="center" style="padding:8px"><div class="bp-ic" style="margin:0 auto 10px">${ICON.calm}</div><h3>You're on the list</h3><p class="muted small">Thanks — we'll reach out to <strong>${esc(email)}</strong> as beta spots open. In the meantime, you can start your Sensory Profile.</p><a class="btn btn-primary" href="#/sensory-profile">Take the Sensory Profile</a></div>`;
      toast('Added to the beta list.');
    });
  }
  // account reset
  const rb = document.getElementById('resetBtn');
  if(rb){ rb.onclick = ()=>{
    if(confirm('Reset all preview data and sign out? This cannot be undone.')){
      STATE = structuredCloneSafe(DEFAULT_STATE); save(); toast('All data cleared.'); navigate('#/home');
    }
  }; }
  // scroll reveal (reduced-motion safe: CSS forces visible if reduced)
  const reveals = document.querySelectorAll('.reveal:not(.in)');
  if(reveals.length && 'IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
    reveals.forEach(el=>io.observe(el));
  } else {
    reveals.forEach(el=>el.classList.add('in'));
  }
  // run any page hook
  if(typeof window._pageHook === 'function'){ const h = window._pageHook; window._pageHook = null; h(); }
}

function wireContact(){
  const f = document.getElementById('contactForm');
  if(!f) return;
  f.addEventListener('submit',(e)=>{
    e.preventDefault();
    const email = document.getElementById('ct-email').value.trim();
    const err = document.getElementById('ct-email-err');
    const name = document.getElementById('ct-name').value.trim();
    const msg = document.getElementById('ct-msg').value.trim();
    if(!name){ toast('Please add your name.'); document.getElementById('ct-name').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Please enter a valid email address.'; document.getElementById('ct-email').focus(); return; }
    err.textContent='';
    if(!msg){ toast('Please add a short message.'); document.getElementById('ct-msg').focus(); return; }
    f.closest('.card').innerHTML = `<div class="center" style="padding:12px"><span class="medallion sage" style="margin:0 auto 12px">${ICON.check}</span><h3>Message ready to send</h3><p class="muted small">Thanks, ${esc(name)}. In this preview, messages aren't transmitted — but your note is captured here so nothing is lost. We'll follow up at <strong>${esc(email)}</strong> once messaging is live.</p><a class="btn btn-secondary" href="#/home">Back to home</a></div>`;
    toast('Message captured.');
  });
}

let quizState = null;
function initQuiz(){
  const p = STATE.sensoryProfile;
  quizState = {
    step:0,
    data:{
      desiredStates: p? [...p.desiredStates]:[],
      sensitivities: p? [...p.sensitivities]:[],
      helpfulInputs: p? [...p.helpfulInputs]:[],
      aesthetics: p? [...p.aesthetics]:[],
      cannabisUse: p? p.cannabisUse:'',
      cannabisGoals: p? [...p.cannabisGoals]:[],
      productFormats: p? [...p.productFormats]:[]
    }
  };
}

function quizSteps(){
  const d = quizState.data;
  const steps = [
    { key:'desiredStates', legend:'Which states are you reaching for?',
      hint:'Choose all that feel true right now.', options:OPT.desiredStates, multi:true, required:true },
    { key:'sensitivities', legend:'What tends to overwhelm you?',
      hint:'Sensitivity sits on a spectrum, not a label — pick the inputs you find intense, draining, or hard to settle from.', options:OPT.sensitivities, multi:true, required:false },
    { key:'helpfulInputs', legend:'What helps you settle or focus?',
      hint:'Inputs that tend to feel supportive.', options:OPT.helpfulInputs, multi:true, required:false },
    { key:'aesthetics', legend:'Which aesthetics feel like you?',
      hint:'This shapes the tone of your blueprints.', options:OPT.aesthetics, multi:true, required:false },
    { key:'cannabisUse', legend:'Is cannabis part of your exploration?',
      hint:'Entirely optional. This never changes the core of your profile.',
      options:['No, not for me','I currently use cannabis','Curious / exploring'], multi:false, required:true, single:true }
  ];
  // conditional cannabis steps
  if(d.cannabisUse === 'I currently use cannabis' || d.cannabisUse === 'Curious / exploring'){
    steps.push({ key:'cannabisGoals', legend:'What are you hoping cannabis might support?',
      hint:'Personal goals only — not medical use.', options:OPT.cannabisGoals, multi:true, required:false });
    steps.push({ key:'productFormats', legend:'Which formats do you tend to reach for?',
      hint:'Helps you log faster later. Optional.', options:OPT.productFormats, multi:true, required:false });
  }
  return steps;
}

views['sensory-profile'] = () => {
  if(!quizState) initQuiz();
  const steps = quizSteps();
  const total = steps.length;
  if(quizState.step >= total){ return quizReview(); }
  const s = steps[quizState.step];
  const d = quizState.data;
  const pct = Math.round((quizState.step/total)*100);
  const selected = s.single ? [d[s.key]] : (d[s.key]||[]);
  const chips = s.options.map(o=>{
    const on = s.single ? d[s.key]===o : (d[s.key]||[]).includes(o);
    return chip('q_'+s.key, o, on, s.multi);
  }).join('');
  window._pageHook = ()=> wireQuizStep(s);
  return `
  <section class="section">
    <div class="narrow">
      <h1 class="visually-hidden">Sensory Profile quiz</h1>
      <div class="stepdots">Step ${quizState.step+1} of ${total} · Sensory Profile</div>

        <div class="choices" id="quizChoices">${chips}</div>
      </fieldset>
      <p id="quizErr" class="small" style="color:var(--danger);min-height:1.2em" role="alert"></p>
      <div style="display:flex; gap:12px; margin-top:8px">
        ${quizState.step>0? '<button class="btn btn-secondary" id="qBack" type="button">Back</button>':'<a class="btn btn-secondary" href="#/home">Cancel</a>'}
        <button class="btn btn-primary" id="qNext" type="button" style="flex:1">${quizState.step===total-1?'Review':'Continue'}</button>
      </div>
    </div>
  </section>`;
};

function wireQuizStep(s){
  const d = quizState.data;
  const collect = ()=>{
    const inputs = [...document.querySelectorAll('#quizChoices input')];
    if(s.single){ const c = inputs.find(i=>i.checked); d[s.key] = c? c.value : ''; }
    else { d[s.key] = inputs.filter(i=>i.checked).map(i=>i.value); }
  };
  const back = document.getElementById('qBack');
  if(back) back.onclick = ()=>{ collect(); quizState.step--; render(); };
  document.getElementById('qNext').onclick = ()=>{
    collect();
    const err = document.getElementById('quizErr');
    if(s.required){
      const empty = s.single ? !d[s.key] : (!d[s.key]||d[s.key].length===0);
      if(empty){ err.textContent = 'Please choose at least one option to continue.'; return; }
    }
    err.textContent='';
    quizState.step++; render();
  };
}

function quizReview(){

          ${cannabisShown? row('Cannabis goals', d.cannabisGoals):''}
          ${cannabisShown? row('Common formats', d.productFormats):''}

        <div class="card">
          <h3>Save &amp; create your space</h3>

            <input id="pf-name" type="text" autocomplete="name" value="${esc(STATE.user?STATE.user.name:'')}"/>
          </label>
          <label class="field" for="pf-email"><span class="lab">Email <span class="hint">(optional — to save your beta spot)</span></span>
            <input id="pf-email" type="email" autocomplete="email" value="${esc(STATE.user?STATE.user.email:'')}"/>

          <div style="display:flex; gap:12px; flex-wrap:wrap">

        </div>
      </form>
      <p class="muted small">${esc(SAFETY_LINE)}</p>
    </div>
  </section>`;
}

/* ============================================================
   INSIGHTS ENGINE (rules-based)
   Compares average outcome scores across environment groupings.
   ============================================================ */
function avgFor(logs, key){ const v = logs.map(l=>l.scores[key]).filter(n=>typeof n==='number'); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }

/* ------------------------------------------------------------------
   Evidence-informed thresholds (see Research Dossier §4):
   - Require a minimum total sample and per-group sample before surfacing
     anything (guards against small-sample noise).
   - Require a meaningful average gap (guards against trivial differences).
   - Cap the number of surfaced patterns (guards against the
     multiple-comparisons problem — tracking many variables guarantees
     some spurious "findings").
   - Grade each pattern's confidence by how much data supports it, and
     always frame as association + hypothesis + a test to run (N-of-1).
   ------------------------------------------------------------------ */
const NSS_MIN_LOGS = 4;      // minimum total entries before any insight
const NSS_MIN_GROUP = 2;     // each compared group needs >= this many entries
const NSS_GAP = 1.5;         // minimum gap (0-10 scale) to be worth mentioning
const NSS_MAX_INSIGHTS = 4;  // cap simultaneous patterns (multiple comparisons)

function computeInsights(){
  const logs = STATE.logs;
  if(logs.length < NSS_MIN_LOGS) return [];

  // Compare the highest vs lowest group for a field/outcome, honoring min-group size.
  function groups(field, outcome){
    const g = {};
    logs.forEach(l=>{ const v=l[field]; if(!v) return; (g[v]=g[v]||[]).push(l); });
    const rows = Object.entries(g)
      .map(([v,ls])=>({v, n:ls.length, a:avgFor(ls,outcome)}))
      .filter(r=>r.a!=null && r.n>=NSS_MIN_GROUP);
    if(rows.length<2) return null;
    rows.sort((x,y)=>y.a-x.a);
    return rows;
  }
  // Confidence grade from the data supporting a comparison.
  function grade(topN, botN){
    const m = Math.min(topN, botN), tot = logs.length;
    if(m>=5 && tot>=12) return 'Moderate';
    if(m>=3 && tot>=8)  return 'Emerging';
    return 'Preliminary';
  }

  const cand = [];
  const add = (rows, spec)=>{
    if(!rows) return;
    const top=rows[0], bot=rows[rows.length-1];
    const gap = top.a - bot.a;
    if(gap < NSS_GAP) return;
    if(spec.excludeTop && spec.excludeTop.includes(top.v)) return;
    cand.push({
      tag: spec.tag,
      gap,
      confidence: grade(top.n, bot.n),
      n: top.n + bot.n,
      text: spec.text(top,bot),
      detail: spec.detail(top,bot),
      experiment: spec.experiment(top,bot)
    });
  };

  add(groups('lighting','calm'), {
    tag:'Calm',
    text:(t)=>`${t.v} lighting appears associated with your calmer entries.`,
    detail:(t,b)=>`Calm averaged ${t.a.toFixed(1)}/10 on ${lc(t.v)}-lit entries (${t.n}) versus ${b.a.toFixed(1)}/10 on ${lc(b.v)}-lit ones (${b.n}). This is a correlation in your logs, not a cause.`,
    experiment:(t)=>`For your next 3 evenings, deliberately set ${lc(t.v)} lighting and log your calm score. If it holds across repeats, the pattern is likely real for you.`
  });
  add(groups('clutter','overstimulation'), {
    tag:'Overstimulation',
    text:(t,b)=>`Higher clutter may be associated with more overstimulation for you.`,
    detail:(t,b)=>`Overstimulation averaged ${t.a.toFixed(1)}/10 in “${t.v}” spaces (${t.n}) versus ${b.a.toFixed(1)}/10 in “${b.v}” spaces (${b.n}). Other factors could explain this — treat it as a lead, not a verdict.`,
    experiment:(t,b)=>`Try clearing one surface before a few sessions in your usual space and log overstimulation. Compare the tidier runs to the cluttered ones.`
  });
  add(groups('sound','focus'), {
    tag:'Focus',
    text:(t)=>`Your higher-focus entries tend to involve ${lc(t.v)}.`,
    detail:(t,b)=>`Focus averaged ${t.a.toFixed(1)}/10 with ${lc(t.v)} (${t.n}) versus ${b.a.toFixed(1)}/10 with ${lc(b.v)} (${b.n}). A pattern to explore for deep work.`,
    experiment:(t)=>`Pick two focus blocks this week with ${lc(t.v)} and two without, keeping everything else similar, then compare your focus scores.`
  });
  add(groups('screens','anxiety'), {
    tag:'Anxiety',
    text:()=>`Heavier screen exposure may be associated with higher reported anxiety.`,
    detail:(t,b)=>`Anxiety averaged ${t.a.toFixed(1)}/10 with “${t.v}” screen exposure (${t.n}) versus ${b.a.toFixed(1)}/10 with “${b.v}” (${b.n}). Direction and cause aren't established by this alone.`,
    experiment:()=>`Try a lighter-screen evening a few times and log anxiety, comparing against your heavier-screen entries.`
  });
  add(groups('lighting','sleepSupport'), {
    tag:'Sleep',
    text:(t)=>`${t.v} lighting appears associated with better sleep-support entries.`,
    detail:(t,b)=>`Sleep support averaged ${t.a.toFixed(1)}/10 with ${lc(t.v)} lighting (${t.n}) versus ${b.a.toFixed(1)}/10 with ${lc(b.v)} (${b.n}). Consistent with evening-light research, but this is your own pattern to test.`,
    experiment:(t)=>`Keep evening lighting ${lc(t.v)} and low for several nights and log sleep support; compare with brighter evenings.`
  });
  add(groups('sound','calm'), {
    tag:'Calm',
    text:(t)=>`${t.v} appears associated with your calmer entries.`,
    detail:(t,b)=>`Calm averaged ${t.a.toFixed(1)}/10 with ${lc(t.v)} (${t.n}) versus ${b.a.toFixed(1)}/10 with ${lc(b.v)} (${b.n}).`,
    experiment:(t)=>`Deliberately choose ${lc(t.v)} for a few sessions and log calm, comparing to sessions without it.`
  });

  // Cannabis set-and-setting pattern (only if enough product sessions)
  const prod = logs.filter(l=>l.usedProduct);
  if(prod.length>=NSS_MIN_LOGS){
    const busy = (l)=> ['Noisy / busy','Music'].includes(l.sound) || l.clutter==='High clutter' || l.brightness==='Bright';
    const hi = prod.filter(busy), lo = prod.filter(l=>!busy(l));
    if(hi.length>=NSS_MIN_GROUP && lo.length>=NSS_MIN_GROUP){
      const hiO = avgFor(hi,'overstimulation'), loO = avgFor(lo,'overstimulation');
      if(hiO!=null && loO!=null && (hiO-loO)>=NSS_GAP){
        cand.push({ tag:'Set & setting', gap:hiO-loO, confidence:grade(hi.length,lo.length), n:hi.length+lo.length,
          text:`On product sessions, higher-stimulation settings may feel more intense for you.`,
          detail:`Overstimulation averaged ${hiO.toFixed(1)}/10 in busier settings (${hi.length}) versus ${loO.toFixed(1)}/10 in calmer ones (${lo.length}). This mirrors the general set-and-setting idea, but the research on environment and cannabis is mixed — treat it purely as your own reflection, not guidance.`,
          experiment:`If you choose to, compare a few calmer-setting sessions against busier ones and log overstimulation.` });
      }
    }
  }

  // Rank by effect size, then cap (multiple-comparisons guard).
  cand.sort((a,b)=> b.gap - a.gap);
  return cand.slice(0, NSS_MAX_INSIGHTS);
}
function lc(s){ return String(s||'').toLowerCase(); }
function confBadge(c){
  const map={Moderate:'sage', Emerging:'', Preliminary:''};
  return `<span class="badge${c==='Moderate'?'':' '}" style="background:${c==='Moderate'?'var(--sage-wash)':'var(--surface-2)'};color:${c==='Moderate'?'var(--sage-deep)':'var(--ink-soft)'}">${ICON.check} ${esc(c)} confidence</span>`;
}

views.insights = () => {
  const logs = STATE.logs;
  const ins = computeInsights();
  const remaining = Math.max(0, NSS_MIN_LOGS - logs.length);
  if(logs.length < NSS_MIN_LOGS){
    return `
    <section class="section tight"><div class="narrow">
      <p class="eyebrow">Insights</p><h1>Patterns to explore</h1>
      <div class="empty">
        <div class="em-ic">${ICON.focus}</div>
        <h3>${logs.length===0?'No entries yet':`${logs.length} ${logs.length===1?'entry':'entries'} so far`}</h3>
        <p class="muted small" style="max-width:52ch;margin:0 auto 16px">To surface a pattern responsibly, we wait until you have at least <strong>${NSS_MIN_LOGS} entries</strong> across a few different settings — small samples produce false patterns. ${remaining>0?`About <strong>${remaining} more</strong> to go.`:''}</p>
        <a class="btn btn-primary" href="#/add-log">Add a log</a>
      </div>
      <div class="card" style="margin-top:16px;background:var(--surface-2)">
        <p class="small mb-0">Why the wait? Insights here are grounded in self-tracking research: a handful of days is a tiny, noisy sample, and comparing many factors at once can invent patterns that aren't there. We'd rather show you fewer, sturdier observations. <a href="#/research">How this works &rarr;</a></p>
      </div>
    </div></section>`;
  }
  const body = ins.length ? ins.map(i=>`
    <div class="card">
      <div class="flex items-center" style="gap:10px;flex-wrap:wrap;margin-bottom:6px">
        <span class="pill">${esc(i.tag)}</span>
        ${confBadge(i.confidence)}
        <span class="small faint">${i.n} entries compared</span>
      </div>
      <p style="font-family:var(--serif);font-size:1.28rem;line-height:1.34;letter-spacing:-.01em;margin:4px 0 8px">${esc(i.text)}</p>
      <p class="muted small" style="margin:0 0 14px">${esc(i.detail)}</p>
      <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px">
        <p class="eyebrow" style="margin:0 0 4px">Test it — a small experiment</p>
        <p class="small mb-0">${esc(i.experiment)}</p>
      </div>
    </div>`).join('') : `
    <div class="empty">
      <div class="em-ic">${ICON.focus}</div>
      <h3>No strong patterns yet</h3>
      <p class="muted small" style="max-width:48ch;margin:0 auto">Your entries so far don't show a difference large or consistent enough to call out responsibly. That's a feature, not a bug — keep logging across different settings and sturdier patterns will surface.</p>
    </div>`;
  return `
  <section class="section tight"><div class="narrow">
    <p class="eyebrow">Insights · from ${logs.length} entries</p>
    <h1>Patterns to explore</h1>
    <p class="lede">These describe <strong>associations</strong> in your own self-reports — what tended to co-occur, not what caused what. Each one is a hypothesis with a small experiment to test it.</p>
    ${body}
    <div class="card" style="background:var(--surface-2)">
      <p class="eyebrow" style="margin:0 0 6px">How to read these honestly</p>
      <ul class="muted small" style="margin:0;padding-left:1.1em">
        <li style="margin-bottom:6px">These are <strong>your self-reports</strong>. The act of tracking can itself shift what you notice — so treat logs as a sketch, not a measurement.</li>
        <li style="margin-bottom:6px"><strong>Correlation isn't cause.</strong> A hidden factor (mood, sleep, the day itself) could explain a pattern. The way to find out is to test it.</li>
        <li style="margin-bottom:0">A great day often follows a bad one on its own (<em>regression to the mean</em>). Repeating an experiment several times is what separates signal from rebound.</li>
      </ul>
    </div>
    <p class="muted small">${esc(SAFETY_LINE)} <a href="#/research">See the evidence behind this &rarr;</a></p>
  </div></section>`;
};

/* ============================================================
   MY BLUEPRINT
   ============================================================ */
function bestValue(field, outcome, fallback){
  const logs = STATE.logs;
  const groups = {};
  logs.forEach(l=>{ const v=l[field]; if(!v) return; (groups[v]=groups[v]||[]).push(l); });
  const rows = Object.entries(groups).map(([v,ls])=>({v,a:avgFor(ls,outcome)})).filter(r=>r.a!=null);
  if(!rows.length) return null;
  rows.sort((x,y)=>y.a-x.a);
  return rows[0].v;
}

function buildBlueprints(){
  const p = STATE.sensoryProfile || {aesthetics:[],helpfulInputs:[],sensitivities:[],cannabisUse:'',cannabisGoals:[]};
  const hasData = STATE.logs.length>=2;
  const cannabis = (p.cannabisUse==='I currently use cannabis' || p.cannabisUse==='Curious / exploring');
  const aesthetic = p.aesthetics[0] || 'warm, natural';

  // pull personalized bests where available, else sensible defaults
  const calmLight = (hasData && bestValue('lighting','calm')) || 'Warm';
  const focusSound = (hasData && bestValue('sound','focus')) || 'Silence';
  const sleepLight = (hasData && bestValue('lighting','sleepSupport')) || 'Candle / very warm';
  const calmScent = (hasData && bestValue('scent','calm')) || 'Woody / earthy';
  const createScent = (hasData && bestValue('scent','creativity')) || 'Fresh / clean';

  const note = (personalized)=> personalized && hasData ? ' <span class="pill" style="background:var(--sage-deep);color:#fff;border-color:var(--sage-deep)">from your logs</span>' : '';
  // Evidence tags per guidance row (see Research Dossier). Rows are [label, html, evidence].
  const WELL='Well-supported', MIX='Mixed evidence', PREF='Personal preference';

  return [
    { id:'calm', icon:ICON.calm, title:'Calm Blueprint',
      intro:'A setting that may support settling and downshifting.',
      rows:[
        ['Lighting', `${calmLight} and low in the evening. Reducing light intensity late lowers alerting signals to the circadian system — one of the better-supported environmental levers.${note(hasData && bestValue('lighting','calm'))}`, WELL],
        ['Sound', 'Silence, soft ambient sound, or self-chosen music. Music has some of the most consistent evidence for reducing anxiety; sudden or busy audio tends to do the opposite.', WELL],
        ['Decor / clutter', 'Keep surfaces clear. Cluttered spaces have been correlated with higher stress in some studies, though cause isn\'t established — worth testing for yourself.', MIX],
        ['Scent', `${calmScent} or none, kept gentle. Scent–calm links are real for some people but heavily shaped by personal association, so treat this as preference, not medicine.${note(hasData && bestValue('scent','calm'))}`, PREF],
        ['Color direction', `Muted earth tones — clay, sand, soft olive — matching your ${lc(aesthetic)} preference. Chosen for aesthetic comfort; broad "calming color" claims aren\'t well supported.`, PREF],
        ['Texture', 'Soft, warm textures you can sink into — a blanket, a worn cushion. A comfort choice.', PREF],
        ['Routine', 'A short, consistent wind-down: dim the lights, put screens away, one slow activity in the same order. Consistency itself is a well-supported habit lever.', WELL],
      ],
      cannabis: cannabis ? 'If cannabis is part of your evening, you can log it alongside your setting and watch your own calm scores. Note: the research on whether environment shapes the cannabis experience is mixed, so treat this purely as self-reflection — not medical guidance, dosing, or a way to guarantee a calm experience.' : null,
      avoid:['Bright or cool light in the last hour','Loud or sudden sound','Heavy screen time right before','Comparing yourself on an off day'],
      experiment:'Run a small test: for 3–4 evenings, keep lighting warm and low; on other evenings, don\'t. Log calm each time and compare the two sets. Repeating it is what turns a hunch into something real.' },

    { id:'focus', icon:ICON.focus, title:'Focus Blueprint',
      intro:'A setting that may support sustained attention.',
      rows:[
        ['Lighting', 'Brighter, cooler or natural daylight while you work — daytime light exposure is reasonably well linked to alertness. Avoid glare.', WELL],
        ['Sound', `${focusSound}. ${hasData && bestValue('sound','focus')?'This came from your own logs. ':'Test silence versus soft ambient and keep what helps. '}Chronic background noise reliably impairs concentration, so protecting your soundscape matters.${note(hasData && bestValue('sound','focus'))}`, WELL],
        ['Decor / clutter', 'Low clutter in your field of view; clear the desk to one task. Competing visual input draws on limited attention (lab evidence); the real-world size is uncertain, so test it.', MIX],
        ['Routine', 'A clear start ritual, a single focus block, notifications silenced. Monitoring one clear goal is among the best-supported behavior levers.', WELL],
        ['Scent', 'Fresh, clean, or none — nothing heavy or sedating. A preference lever, not a proven cognitive booster.', PREF],
        ['Color direction', 'Low-distraction palette with one small accent. Aesthetic comfort; "color boosts focus" claims are weak.', PREF],
        ['Texture', 'Firm, supportive seating; minimal fidget surfaces. A comfort choice.', PREF],
      ],
      cannabis: cannabis ? 'Cannabis affects concentration differently for different people and can hinder it. If you explore it, log honestly and let your own focus scores speak. This is not a recommendation or endorsement.' : null,
      avoid:['High clutter','Busy or noisy background','Frequent screen switching','Multitasking'],
      experiment:'Pick two focus blocks with your candidate setup and two without, keeping the task similar, then compare focus scores across the four. More repeats, more confidence.' },

    { id:'sleep', icon:ICON.sleep, title:'Sleep Blueprint',
      intro:'A supportive evening environment — not a treatment for sleep problems.',
      rows:[
        ['Lighting', `${sleepLight}. Keep light warm and as low as is comfortable in the hours before bed; light sensitivity varies a lot between people, so find your own level. Evening-light effects on the body clock are well established.${note(hasData && bestValue('lighting','sleepSupport'))}`, WELL],
        ['Darkness', 'Make the sleep space as dark as feasible. Even modest light during sleep has been shown to affect overnight physiology — a well-supported reason to dim and cover light sources.', WELL],
        ['Temperature', 'Keep the room on the cool side. A cool, comfortable bedroom supports sleep; heat above your comfort zone tends to fragment it.', WELL],
        ['Sound', 'Quiet, or steady soft sound. Nighttime noise fragments sleep even when you don\'t fully wake, so lowering it is worthwhile.', WELL],
        ['Routine', 'Most supported of all: keep sleep and wake times consistent, with a calm, screen-light wind-down. Regular timing is strongly linked to better outcomes in large studies.', WELL],
        ['Scent', 'Subtle and familiar, or none. A comfort preference, not a sleep aid.', PREF],
        ['Texture', 'Comfortable bedding and soft, warm layers. A comfort choice.', PREF],
      ],
      cannabis: cannabis ? 'Some people include cannabis in an evening routine; effects on sleep vary between people and can change over time. Observe your own sleep-support scores if you wish, but this is not a sleep aid, treatment, or medical claim.' : null,
      avoid:['Bright or cool light late','A light or warm sleep space','Stimulating sound or content','Irregular bed/wake times'],
      experiment:'For several nights, keep the room dark, cool, and your bedtime consistent; note sleep support. Compare with your less-consistent nights. If sleep problems persist, please talk with a qualified professional.' },

    { id:'creative', icon:ICON.creative, title:'Creative Blueprint',
      intro:'A setting that may support open, playful thinking.',
      rows:[
        ['Lighting', 'Warm and comfortable, with some natural light if you can. Soft, not harsh — a comfort-led choice.', PREF],
        ['Sound', 'Whatever loosens you — soft music or ambient sound. Music\'s mood effects are reasonably supported; test what opens you up.', MIX],
        ['Decor / clutter', 'A little curated texture can feel inspiring; keep it from tipping into overwhelm. (The popular "mess boosts creativity" study failed to replicate, so trust your own experience over the myth.)', MIX],
        ['Routine', 'A low-pressure warm-up, then protected, unstructured making time. Reducing interruptions is the dependable part.', MIX],
        ['Scent', `${createScent} or a scent you link with ease. Personal association matters more than any universal effect.${note(hasData && bestValue('scent','creativity'))}`, PREF],
        ['Color direction', `Textured, characterful tones in your ${lc(aesthetic)} direction. An aesthetic choice to enjoy.`, PREF],
        ['Texture', 'Varied, tactile materials within reach. Comfortable but not sleepy.', PREF],
      ],
      cannabis: cannabis ? 'If cannabis is part of your creative practice, your set and setting still shape the experience. Log the environment alongside it and let your own creativity scores surface what fits. Personal exploration only — not advice.' : null,
      avoid:['Harsh lighting','Rigid, sterile spaces','Constant interruptions','Pressure to perform'],
      experiment:'Try your candidate setup for a few short, judgment-free making sessions and skip it for a few others; compare your creativity scores across both.' },
  ];
}

views.blueprint = () => {
  const bps = buildBlueprints();
  const hasData = STATE.logs.length>=2;
  window._pageHook = ()=>{
    const tabs = [...document.querySelectorAll('.tab')];
    const panels = [...document.querySelectorAll('[role=tabpanel]')];
    tabs.forEach(t=> t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.setAttribute('aria-selected','false'));
      panels.forEach(pn=> pn.hidden = true);
      t.setAttribute('aria-selected','true');
      document.getElementById(t.getAttribute('aria-controls')).hidden = false;
    }));
    // keyboard arrow support
    tabs.forEach((t,i)=> t.addEventListener('keydown',(e)=>{
      let n=null; if(e.key==='ArrowRight') n=tabs[(i+1)%tabs.length]; if(e.key==='ArrowLeft') n=tabs[(i-1+tabs.length)%tabs.length];
      if(n){ e.preventDefault(); n.focus(); n.click(); }
    }));
  };
  const tabBtns = bps.map((b,i)=>`<button class="tab" role="tab" id="tab-${b.id}" aria-controls="panel-${b.id}" aria-selected="${i===0}">${esc(b.title.replace(' Blueprint',''))}</button>`).join('');
  const panels = bps.map((b,i)=>`
    <div role="tabpanel" id="panel-${b.id}" aria-labelledby="tab-${b.id}" ${i===0?'':'hidden'}>
      <div class="card">
        <div class="blueprint-h"><span class="bp-ic">${b.icon}</span><h2 style="margin:0">${esc(b.title)}</h2></div>
        <p class="muted">${esc(b.intro)}</p>
        <dl class="bp">
          ${b.rows.map(([k,v,ev])=>`<dt>${esc(k)}${ev?' '+evTag(ev):''}</dt><dd>${v}</dd>`).join('')}
          ${b.cannabis? `<dt>Optional cannabis context</dt><dd class="muted">${esc(b.cannabis)}</dd>`:''}
          <dt class="avoid">Avoid list</dt><dd><ul style="margin:2px 0 0;padding-left:1.1em">${b.avoid.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></dd>
          <dt>Next experiment <span class="pill" style="background:var(--clay-wash);border-color:var(--line);color:var(--clay-deep)">N-of-1</span></dt><dd><strong>${esc(b.experiment)}</strong></dd>
        </dl>
      </div>
    </div>`).join('');
  return `
  <section class="section tight"><div class="narrow">
    <p class="eyebrow">My Blueprint</p>
    <h1>Supportive environments, tuned to you</h1>
    <p class="lede">Four blueprints drawn from your Sensory Profile${hasData?' and your logs':''}. Each element is tagged by how strong the general evidence is — so you know which levers to trust and which to simply try.</p>
    <div class="flex wrap-gap" style="gap:8px;margin:14px 0 4px">
      ${evTag('Well-supported')} ${evTag('Mixed evidence')} ${evTag('Personal preference')}
    </div>
    <p class="small faint" style="margin:2px 0 18px">These are supportive-environment suggestions for self-reflection — not prescriptions, treatment, or medical advice. Each blueprint ends with a small within-person (N-of-1) test, the honest way to learn what actually works for you.</p>
    ${hasData?'':`<div class="card" style="background:var(--surface-2)"><p class="small" style="margin:0">These start from your profile and general evidence. Add a few logs and your blueprints will personalize to what <em>you reported</em>. <a href="#/add-log">Add a log &rarr;</a></p></div>`}
    <div class="tabs" role="tablist" aria-label="Blueprints">${tabBtns}</div>
    ${panels}
    <p class="muted small">${esc(SAFETY_LINE)} <a href="#/research">See the evidence &rarr;</a></p>
  </div></section>`;
};
function evTag(kind){
  const m = {
    'Well-supported':['var(--sage-wash)','var(--sage-deep)'],
    'Mixed evidence':['#f4ecdd','#8a6d2f'],
    'Personal preference':['var(--surface-2)','var(--ink-soft)']
  };
  const c = m[kind] || m['Personal preference'];
  return `<span class="badge" style="background:${c[0]};color:${c[1]};border-color:var(--line);font-size:.72rem">${esc(kind)}</span>`;
}

if(!location.hash) location.hash = '#/home';
render();
</script>
