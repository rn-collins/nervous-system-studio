<meta property="og:description" content="Nervous System Studio helps you design sensory environments and daily routines that support calm, focus, creativity, and sleep. Built by RN Collins." />

<style>
:root{
  /* A logbook, not a lounge. The ground moves off the warm cream this estate
     uses on a third of its builds, onto a cool paper; the earth accents stay,
     because clay and sage are this build's own and sage carries the Moderate
     confidence grade. */
  --bg:            #EEEDE9;   /* cool paper */
  --surface:       #FFFFFF;   /* the page you write on */
  --surface-2:     #E4E3DE;   /* ruled band */
  --ink:           #23211D;   /* near-black, 15.6:1 on the ground */
  --ink-soft:      #55524B;   /* secondary text */
  --line:          #CFCDC5;   /* rule */
  --clay:          #8d5f45;   /* muted terracotta accent (AA on --bg for eyebrow/dt text) */
  --clay-deep:     #7d5238;   /* darker accent for text/contrast */
  --sage:          #6f7d63;   /* muted sage */
  --sage-deep:     #55604b;
  --sand:          #97836b;   /* control borders: 3.58:1 on --surface, 3.26:1 on --bg */
  --focus:         #3f5d78;   /* accessible focus ring (blue-slate) */
  --danger:        #8a3b34;
  /* Rules, not cards. 18px radius and a soft drop shadow is the wellness-app
     idiom; this thing is an instrument that publishes its own thresholds. */
  --radius:        2px;
  --radius-sm:     2px;
  --shadow:        none;
  --maxw:          1080px;
  /* --font led with Georgia, so every heading here rendered Georgia — the face
     32 of 67 builds in this estate were on — and the Fraunces/Inter link above
     was never used by any rule. Andada Pro was drawn for text and for data, and
     Martian Mono carries every number, threshold, grade and count, so a reading
     is legible as a reading rather than as prose. Neither is used elsewhere. */
  --font: 'Andada Pro', Georgia, serif;
  --sans: 'Andada Pro', Georgia, serif;
  --mono: 'Martian Mono', ui-monospace, SFMono-Regular, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font); font-weight:600; line-height:1.2; color:var(--ink); margin:0 0 .5em}
h1{font-size:2.1rem; letter-spacing:-.01em}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:0 0 1em}
a{color:var(--clay-deep)}
img{max-width:100%}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
.narrow{max-width:680px; margin:0 auto; padding:0 20px}

/* Accessibility: visible focus everywhere */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible, .chip:focus-visible{
  outline:3px solid var(--focus); outline-offset:2px; border-radius:var(--radius);
}
.skip{position:absolute; left:-999px; top:0; background:var(--ink); color:#fff; padding:10px 16px; z-index:100; border-radius:0}
.skip:focus{left:0}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  font-family:var(--sans); font-size:1rem; font-weight:600; cursor:pointer;
  padding:13px 22px; border-radius:var(--radius); border:1.5px solid transparent;
  text-decoration:none; transition:background .15s, border-color .15s, transform .05s; min-height:48px;
}
@media (prefers-reduced-motion: reduce){ .btn{transition:none} *{scroll-behavior:auto !important} }
.btn-primary{background:var(--clay-deep); color:#fff}
.btn-primary:hover{background:#6a4530}
.btn-secondary{background:transparent; color:var(--ink); border-color:var(--sand)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent; color:var(--clay-deep); padding:10px 14px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* Header / nav */
header.site{position:sticky; top:0; z-index:40; background:rgba(246,242,236,.9); backdrop-filter:saturate(1.1) blur(8px); border-bottom:1px solid var(--line)}
.nav{display:flex; align-items:center; gap:16px; height:64px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-family:var(--font); font-weight:600; font-size:1.1rem}
.brand .mark{width:26px; height:26px; flex:none}
.nav .spacer{flex:1}
.nav-links{display:flex; align-items:center; gap:6px}
.nav-links a{color:var(--ink-soft); text-decoration:none; padding:8px 12px; border-radius:var(--radius); font-size:.95rem; font-weight:600}
.nav-links a:hover{background:var(--surface-2); color:var(--ink)}
.nav-links a[aria-current="page"]{color:var(--clay-deep); background:var(--surface-2)}
.menu-toggle{display:none; background:transparent; border:1.5px solid var(--sand); border-radius:var(--radius); padding:8px 10px; cursor:pointer; min-height:44px}
@media (max-width:860px){
  .nav-links{position:fixed; inset:64px 0 auto 0; background:var(--surface); flex-direction:column; align-items:stretch; padding:12px 16px; border-bottom:1px solid var(--line); gap:2px; box-shadow:var(--shadow)}
  .nav-links[hidden]{display:none}
  .nav-links a{padding:12px 10px}
  .menu-toggle{display:inline-flex}
}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px}
.card + .card{margin-top:16px}
.grid{display:grid; gap:16px}
@media (min-width:720px){ .grid.cols-2{grid-template-columns:1fr 1fr} .grid.cols-3{grid-template-columns:repeat(3,1fr)} .grid.cols-4{grid-template-columns:repeat(4,1fr)} }
.eyebrow{font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em; font-size:.68rem; font-weight:500; color:var(--clay-deep); margin-bottom:12px}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}
.pill{display:inline-block; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); border-radius:var(--radius); padding:4px 12px; font-family:var(--mono); font-size:.74rem; font-weight:500; margin:0 6px 6px 0}
.section{padding:64px 0}
.section.tight{padding:40px 0}
.center{text-align:center}
.hr{height:1px; background:var(--line); border:0; margin:32px 0}

/* Forms */
label.field{display:block; margin-bottom:18px}
label.field > .lab{display:block; font-weight:600; margin-bottom:6px; font-size:.95rem}
label.field .hint{font-weight:400; color:var(--ink-soft); font-size:.85rem}
input[type=text], input[type=email], input[type=date], input[type=time], input[type=number], select, textarea{
  width:100%; font-family:var(--sans); font-size:1rem; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--sand); border-radius:var(--radius-sm);
  padding:12px 14px; min-height:48px;
}
textarea{min-height:110px; resize:vertical}
.choices{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
.chip{display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--sand); border-radius:var(--radius); padding:10px 16px; cursor:pointer; font-size:.95rem; font-weight:600; color:var(--ink); min-height:44px}
.chip input{position:absolute; opacity:0; width:1px; height:1px}
.chip[data-on="true"]{background:var(--sage-deep); border-color:var(--sage-deep); color:#fff}
.chip .tick{opacity:0}
.chip[data-on="true"] .tick{opacity:1}
fieldset{border:0; padding:0; margin:0 0 18px}
legend{font-weight:600; margin-bottom:8px; padding:0; font-size:.95rem}

/* Range/scores */
.scorerow{display:grid; grid-template-columns:1fr; gap:6px; margin-bottom:16px}
.scorerow .top{display:flex; justify-content:space-between; align-items:baseline}
.scorerow output{font-family:var(--mono); font-weight:600; color:var(--clay-deep); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--sage-deep); min-height:32px}

/* Dashboard layout */
.app-shell{display:block}
.metric{display:flex; flex-direction:column; gap:4px}
.metric .n{font-family:var(--mono); font-size:1.7rem; font-weight:600; color:var(--clay-deep); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.metric .l{font-family:var(--mono); font-size:.7rem; letter-spacing:.02em; color:var(--ink-soft); font-weight:500}

/* Bars for insights */
.bar{height:10px; background:var(--surface-2); border-radius:0; overflow:hidden; border:1px solid var(--line)}
.bar > span{display:block; height:100%; background:var(--sage-deep)}

/* Log list */
.logitem{display:flex; gap:14px; align-items:flex-start; padding:16px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface)}
.logitem + .logitem{margin-top:10px}
.logitem .tag{font-family:var(--mono); font-size:.7rem; font-weight:500; color:var(--sage-deep)}

/* Empty state */
.empty{text-align:center; padding:40px 20px; border:1.5px dashed var(--sand); border-radius:var(--radius); background:var(--surface)}
.empty .em-ic{width:44px; height:44px; margin:0 auto 12px; color:var(--clay)}

/* Toast */
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:var(--radius); box-shadow:var(--shadow); z-index:80; font-size:.95rem}
#toast[hidden]{display:none}

/* Footer */
footer.site{border-top:1px solid var(--line); background:var(--surface); margin-top:48px}
footer.site .cols{display:grid; gap:24px; padding:40px 0}
@media(min-width:720px){ footer.site .cols{grid-template-columns:2fr 1fr 1fr} }
footer.site a{display:block; color:var(--ink-soft); text-decoration:none; padding:4px 0; font-size:.92rem}
footer.site a:hover{color:var(--ink)}
.disclaimer-band{background:var(--surface-2); border-top:1px solid var(--line); font-size:.82rem; color:var(--ink-soft)}
.disclaimer-band .wrap{padding:16px 20px}

/* Hero */
.hero{padding:72px 0 48px}
.hero h1{font-size:2.6rem; max-width:16ch}
.hero p.sub{font-size:1.15rem; color:var(--ink-soft); max-width:60ch}
.hero .ctas{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
@media(min-width:900px){ .hero h1{font-size:3.2rem} }

/* progress */
.progress{height:6px; background:var(--surface-2); border-radius:0; overflow:hidden; margin-bottom:24px}
.progress > span{display:block; height:100%; background:var(--clay); transition:width .2s}
@media (prefers-reduced-motion: reduce){ .progress>span{transition:none} }

.stepdots{font-family:var(--mono); font-size:.74rem; color:var(--ink-soft); font-weight:500; margin-bottom:8px}
.blueprint-h{display:flex; align-items:center; gap:12px; margin-bottom:4px}
.bp-ic{width:30px;height:30px;flex:none;color:var(--sage-deep)}
dl.bp{margin:0}
dl.bp dt{font-family:var(--mono); font-weight:500; margin-top:14px; font-size:.74rem; text-transform:uppercase; letter-spacing:.04em; color:var(--clay-deep)}
dl.bp dd{margin:2px 0 0}
.avoid{color:var(--danger)}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
.tab{background:var(--surface); border:1.5px solid var(--sand); border-radius:var(--radius); padding:8px 16px; font-family:var(--mono); font-size:.82rem; font-weight:500; cursor:pointer; min-height:44px}
.tab[aria-selected="true"]{background:var(--clay-deep); color:#fff; border-color:var(--clay-deep)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* =====================================================================
   PREMIUM LAYER — elevated typography, color, components, motion
   (cascades over the base styles above)
   ===================================================================== */
:root{
  --bg:#EEEDE9;
  --bg-2:#E7E6E1;
  --surface:#FFFFFF;
  --surface-2:#E9E8E3;
  --ink:#23211D;
  --ink-soft:#55524B;
  --ink-faint:#706456;      /* was #867a6c: 3.35:1 on the deepest band */
  --line:#D3D1CA;
  --line-strong:#848279;    /* input borders: a control boundary, now 3.08:1 */
  --clay:#8E5837;           /* was #a06a49: eyebrows measured 3.61:1 */
  --clay-deep:#7a4d30;
  --clay-wash:#f3e7dc;
  --sage:#68765b;
  --sage-deep:#4e5a44;
  --sage-wash:#e9ece1;
  --sand:#8F8067;           /* chip, tab and toggle borders: 1.52:1 -> 3.08:1 */
  --gold:#b98d3e;
  --focus:#355a7a;
  --danger:#8a3b34;
  /* A logbook is ruled, not upholstered. 20-28px radii and three tiers of drop
     shadow are the wellness-app idiom; what this build actually is, is an
     instrument that publishes the thresholds it will and will not speak at. */
  --radius:2px;
  --radius-sm:2px;
  --radius-lg:3px;
  --shadow-sm:none;
  --shadow:none;
  --shadow-lg:none;
  --maxw:1120px;
  /* Fraunces was shared with three other builds here and Inter with the estate
     at large; the base layer below also led --font with Georgia, so a heading
     rendered whichever of the two won. Andada Pro was drawn for text and for
     data, and Martian Mono carries every number, threshold, grade, count and
     date, so a reading reads as a reading and not as prose. Neither family is
     used anywhere else in this estate. */
  --serif:'Andada Pro', Georgia, serif;
  --sans:'Andada Pro', Georgia, serif;
  --mono:'Martian Mono', ui-monospace, SFMono-Regular, monospace;
  --font:var(--serif);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{font-family:var(--sans); color:var(--ink); background:var(--bg); font-size:17px; line-height:1.62; letter-spacing:-.002em}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:-.02em; color:var(--ink)}
h1{font-size:clamp(2.1rem,5.2vw,3.4rem); line-height:1.06}
h2{font-size:clamp(1.6rem,3.6vw,2.35rem); line-height:1.12}
h3{font-size:1.25rem; letter-spacing:-.01em}
.card h2, .step h2, .faq h2{font-size:1.25rem; letter-spacing:-.01em; line-height:1.2}
.wrap{max-width:var(--maxw)}
.narrow{max-width:720px}
.reading{max-width:660px; margin:0 auto; padding:0 20px}
.eyebrow{color:var(--clay-deep); font-family:var(--mono); font-weight:500; font-size:.66rem; letter-spacing:.05em}
.lede{font-size:1.2rem; color:var(--ink-soft); line-height:1.55; max-width:60ch}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.section{padding:clamp(52px,8vw,104px) 0}
.section.tight{padding:clamp(36px,5vw,60px) 0}
.section-alt{background:linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);border:0;margin:0}
.center{text-align:center}
.stack-sm > * + *{margin-top:10px}

/* ---- Buttons: refined ---- */
.btn{font-family:var(--sans); font-weight:600; font-size:1rem; border-radius:var(--radius); padding:14px 26px; min-height:52px; letter-spacing:.01em; box-shadow:none; position:relative; transition:transform .16s ease, background .16s, border-color .16s, box-shadow .16s}
.btn-primary{background:var(--clay-deep); color:#fff}
.btn-primary:hover{background:#673f27}
.btn-secondary{background:var(--surface); border-color:var(--line-strong); color:var(--ink)}
.btn-secondary:hover{background:var(--surface-2); border-color:var(--sand)}
.btn-lg{padding:16px 30px; min-height:56px; font-size:1.05rem}
.btn:not(.btn-block):hover{transform:none}
@media (prefers-reduced-motion: reduce){ .btn:hover{transform:none} }
.btn svg{width:20px;height:20px}

/* ---- Header / nav: refined ---- */
header.site{background:rgba(245,241,234,.82); backdrop-filter:saturate(1.2) blur(12px); border-bottom:1px solid rgba(230,221,206,.7)}
.nav{height:72px; gap:20px}
.brand{font-family:var(--serif); font-size:1.12rem; letter-spacing:-.02em; gap:11px}
.brand .mark{width:30px;height:30px}
.nav-links{gap:2px}
.nav-links a{font-family:var(--sans); font-weight:500; font-size:.95rem; color:var(--ink-soft); padding:9px 13px; border-radius:var(--radius)}
.nav-links a:hover{color:var(--ink); background:rgba(233,224,209,.6)}
.nav-links a[aria-current="page"]{color:var(--clay-deep); background:transparent; font-weight:600}
.nav-links a.nav-cta{background:var(--clay-deep); color:#fff; font-weight:600; padding:10px 18px; margin-left:6px}
.nav-links a.nav-cta:hover{background:#673f27; color:#fff}
@media(max-width:860px){
  .nav-links{gap:2px; padding:14px 16px 20px; box-shadow:var(--shadow)}
  .nav-links a{padding:13px 12px; font-size:1rem; border-bottom:1px solid var(--line)}
  .nav-links a:last-child{border-bottom:0}
  .nav-links a.nav-cta{margin:10px 0 0; text-align:center; border-bottom:0}
}
.menu-toggle{border-color:var(--sand); border-radius:var(--radius); font-weight:600; color:var(--ink); gap:8px}

/* ---- Cards: refined + interactive ---- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px}
.card + .card{margin-top:18px}
a.card, .card-link{display:block; text-decoration:none; color:inherit; transition:transform .18s ease, box-shadow .18s, border-color .18s}
a.card:hover, .card-link:hover{transform:none; border-color:var(--clay-deep)}
@media (prefers-reduced-motion: reduce){ a.card:hover,.card-link:hover{transform:none} }
.card-pad-lg{padding:clamp(28px,4vw,44px)}
.grid{gap:20px}

/* ---- Icon medallion ---- */
.medallion{width:52px;height:52px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;background:var(--clay-wash);color:var(--clay-deep);flex:none;border:1px solid var(--line)}
.medallion.sage{background:var(--sage-wash);color:var(--sage-deep)}
.medallion svg{width:26px;height:26px}

/* ---- Hero ---- */
.hero{position:relative; padding:clamp(56px,9vw,108px) 0 clamp(40px,6vw,72px); overflow:hidden}
.hero::before{content:""; position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(60% 55% at 80% 8%, rgba(160,106,73,.10), transparent 60%),
    radial-gradient(50% 50% at 8% 90%, rgba(104,118,91,.10), transparent 60%);
}
.hero .kicker{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:7px 15px 7px 12px;font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--ink-soft);margin-bottom:22px}
.hero .kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--sage);flex:none}
.hero h1{max-width:17ch; margin-bottom:20px}
.hero .sub{font-size:clamp(1.08rem,2vw,1.28rem); color:var(--ink-soft); max-width:56ch; line-height:1.5}
.hero .ctas{margin-top:30px; gap:14px}
.hero .reassure{margin-top:22px; display:flex; flex-wrap:wrap; gap:8px 20px; font-size:.9rem; color:var(--ink-soft)}
.hero .reassure span{display:inline-flex;align-items:center;gap:7px}
.hero .reassure svg{width:16px;height:16px;color:var(--sage-deep);flex:none}

/* ---- Preview panel in hero ---- */
.previewcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px}
.previewcard .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.previewcard .row:last-child{border-bottom:0}
.mini-bar{height:8px;width:120px;background:var(--surface-2);border-radius:0;overflow:hidden;border:1px solid var(--line)}
.mini-bar > span{display:block;height:100%;background:var(--sage-deep)}

/* ---- Steps ---- */
.step{position:relative; padding-left:0}
.step .num{font-family:var(--mono); font-size:.95rem; font-weight:600; width:38px;height:38px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;background:var(--clay-deep);color:#fff;margin-bottom:14px}
.step h3{margin-bottom:6px}

/* ---- Audience cards ---- */
.aud{display:flex;gap:14px;align-items:flex-start}
.aud .medallion{width:44px;height:44px;border-radius:var(--radius)}
.aud .medallion svg{width:22px;height:22px}

/* ---- Quote / testimonial ---- */
.quote{font-family:var(--serif); font-size:clamp(1.4rem,3vw,2rem); line-height:1.32; color:var(--ink); letter-spacing:-.02em}
.quote-source{margin-top:14px; font-family:var(--mono); font-size:.8rem; color:var(--ink-soft); font-weight:500}

/* ---- Stat band ---- */
.band{background:var(--sage-deep); color:#fdfbf6; border-radius:var(--radius); padding:clamp(32px,5vw,56px)}
.band h2{color:#fff}
.band .muted{color:rgba(255,255,255,.82)}
.band .btn-secondary{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28); color:#fff}
.band .btn-secondary:hover{background:rgba(255,255,255,.2)}
.band a{color:#fff}

/* ---- FAQ accordion ---- */
.faq{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{list-style:none; cursor:pointer; padding:20px 24px; font-weight:600; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; gap:16px; color:var(--ink); min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--surface-2)}
.faq summary .chev{flex:none; transition:transform .2s; color:var(--clay); font-size:1.4rem; line-height:1}
@media (prefers-reduced-motion: reduce){ .faq summary .chev{transition:none} }
.faq details[open] summary .chev{transform:rotate(45deg)}
.faq .ans{padding:0 24px 22px; color:var(--ink-soft); max-width:70ch}
.faq .ans p:last-child{margin-bottom:0}

/* ---- Pills / badges ---- */
.pill{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); font-family:var(--mono); font-size:.72rem; font-weight:500; padding:5px 13px}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--sage-wash);border:1px solid var(--line);color:var(--sage-deep);border-radius:var(--radius);padding:6px 14px;font-family:var(--mono);font-size:.74rem;font-weight:500}
.badge svg{width:15px;height:15px}

/* ---- Footer: refined ---- */
footer.site{background:var(--bg-2); border-top:1px solid var(--line)}
footer.site .cols{padding:clamp(44px,6vw,68px) 0 40px}
@media(min-width:760px){ footer.site .cols{grid-template-columns:2.2fr 1fr 1fr 1fr 1fr} }
footer.site .eyebrow{margin-bottom:14px}
footer.site a{font-size:.93rem; color:var(--ink-soft)}
footer.site a:hover{color:var(--clay-deep)}
.disclaimer-band{background:var(--bg-2)}
.disclaimer-band .wrap{border-top:1px solid var(--line); padding:18px 20px; max-width:var(--maxw); margin:0 auto}

/* ---- Forms: refined ---- */
label.field > .lab{font-size:.92rem}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{
  border-color:var(--line-strong); border-radius:var(--radius-sm); background:var(--surface); transition:border-color .15s, box-shadow .15s}
input:focus, select:focus, textarea:focus{border-color:var(--clay); box-shadow:0 0 0 3px rgba(160,106,73,.12); outline:none}
/* the line above suppresses the outline for mouse focus; keyboard focus keeps a

input:focus-visible, select:focus-visible, textarea:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.chip{border-color:var(--sand); transition:background .15s, border-color .15s}
.chip:hover{border-color:var(--sand)}
.chip[data-on="true"]{background:var(--sage-deep); border-color:var(--sage-deep)}

/* ---- Progress ---- */

.progress > span{background:linear-gradient(90deg,var(--clay),var(--gold))}

/* ---- Tabs (blueprint) ---- */

/* ---- Metric ---- */
.metric .n{font-family:var(--serif)}

/* ---- Reveal on scroll (progressive, reduced-motion safe) ---- */

.maxw-52{max-width:52ch}.maxw-46{max-width:46ch}

   disclosure on every claim so the arithmetic is one click away. */
.guardstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:18px 0 16px}
.guardstrip>div{background:var(--surface);padding:14px 16px}
.guardstrip .gn{display:block;font-family:var(--font);font-size:1.85rem;line-height:1;color:var(--clay-deep)}
.guardstrip .gl{display:block;font-size:.82rem;font-weight:700;margin-top:6px;color:var(--ink)}
.guardstrip .gd{display:block;font-size:.78rem;color:var(--ink-soft);margin-top:2px}

.rulecard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:12px;box-shadow:var(--shadow)}
.rulecard>*{min-width:0}

.rulecard h3{margin:0 0 6px;font-size:1.1rem;overflow-wrap:anywhere}
.rulenum{font-family:var(--font);font-size:1.5rem;line-height:1.9;text-align:center;
  width:56px;height:56px;flex:none;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--line);color:var(--clay-deep)}

.workwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0 0}

table.work th,table.work td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.work thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-soft);border-bottom:2px solid var(--sand)}
table.work tbody th{font-weight:600}
table.work td{font-variant-numeric:tabular-nums}

details.working{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}

.ladder{display:flex;gap:6px;margin:12px 0 10px}

<!--
  Everything above renders client-side from the hash router, so without
  JavaScript this page served 37 words — no crawler and no reader with
  scripts off saw any of it. The tool genuinely cannot run without JS (it
  keeps every entry in the browser and never transmits one), but that is a
  reason to say so, not a reason to serve a blank page.
-->
<noscript>
  <main id="main" style="max-width:68ch;margin:0 auto;padding:3rem 1.25rem;line-height:1.65">
    <h1>Nervous System Studio</h1>
    <p>A private log for noticing which settings actually help you, and which
    do not. You record where you were and how you felt; after enough entries
    it compares settings against each other and tells you what it found.</p>

    <h2>It needs JavaScript, and it needs it for a reason</h2>
    <p>Every entry stays in this browser. Nothing is transmitted, there is no
    account, and there is no server holding your logs — which means the
    comparison has to run here, in the page. With scripts disabled there is
    nowhere for it to run.</p>

    <h2>What it will and will not tell you</h2>
    <p>It only reports a comparison when the data can carry one. Four numbers
    decide that. They are the difference between this and a horoscope, so it
    is worth saying where each of them comes from rather than asking you to
    take them on faith.</p>

    <h3>At least 4 entries before anything is compared</h3>
    <p>An unusually bad evening tends to be followed by a less unusual one
    whether or not you change anything. That is regression to the mean, and it
    is the reason almost any remedy tried at your worst moment appears to
    work: the measurement had nowhere to go but back toward your average.
    Barnett, van der Pols and Dobson set the problem out plainly in
    <em>Regression to the mean: what it is and how to deal with it</em>,
    <em>International Journal of Epidemiology</em> 34(1):215–220
    (<a href="https://doi.org/10.1093/ije/dyh299">doi:10.1093/ije/dyh299</a>).
    Four entries is not a cure for it. It is the smallest number at which a
    first extreme entry stops dominating everything the tool would say.</p>

    <h3>Each setting seen at least 2 times</h3>
    <p>A group of one is a single evening wearing a label. Nothing in the data
    separates the setting from the day it happened on — the argument you had,
    the sleep you did not get, the fact that it was a Tuesday. Requiring two
    means a claim about a setting has at least been true twice.</p>

    <h3>A gap of at least 1.5 points on the 0–10 scale</h3>
    <p>Self-report moves on its own. Momentary ratings of one&rsquo;s own state
    carry substantial within-person variability from one report to the next,
    which is much of the point of the method reviewed by Shiffman, Stone and
    Hufford in <em>Ecological Momentary Assessment</em>, <em>Annual Review of
    Clinical Psychology</em> 4:1–32 (2008,
    <a href="https://doi.org/10.1146/annurev.clinpsy.3.022806.091415">doi:10.1146/annurev.clinpsy.3.022806.091415</a>).
    A difference of half a point between two groups is not a finding about
    your environment; it is the scale breathing. 1.5 is set above that drift
    on purpose, which means the tool will stay silent about real effects that
    happen to be small.</p>

    <h3>At most 4 observations shown at once</h3>
    <p>Compare enough pairs and some will clear any threshold by chance alone.
    This is the multiple-comparisons problem that Benjamini and Hochberg
    addressed in <em>Controlling the False Discovery Rate</em>, <em>Journal of
    the Royal Statistical Society, Series B</em> 57(1):289–300 (1995,
    <a href="https://doi.org/10.1111/j.2517-6161.1995.tb02031.x">doi:10.1111/j.2517-6161.1995.tb02031.x</a>).
    A capped list is a blunter instrument than a false-discovery-rate
    correction, and it is used here because it is honest about being blunt:
    showing you the four strongest comparisons rather than every pair that
    happened to clear the line.</p>

    <h3>Why the confidence grade stops at Moderate</h3>
    <p>The grades run Preliminary, Emerging, Moderate, and Moderate is the
    ceiling — no amount of logging reaches a higher one. The reason is that a
    log like this is a single-case design, and the standard for treating one
    as evidence is demanding: the What Works Clearinghouse
    <em>Procedures and Standards Handbook, Version 5.0</em> requires
    <a href="https://ies.ed.gov/ncee/WWC/Docs/referenceresources/Final_WWC-HandbookVer5_0-0-508.pdf">at
    least three demonstrations of an effect at three different points in
    time</a>. Keeping a journal and comparing groups afterwards does not
    produce that, however many entries accumulate. The ceiling is where it is
    because the design cannot support a higher claim, not because the tool is
    being modest.</p>

    <h3>The log is not a neutral instrument</h3>
    <p>One thing worth knowing before you start: monitoring your own progress
    tends to change it. Harkin and colleagues found this across 138
    experimental studies in <em>Does monitoring goal progress promote goal
    attainment?</em>, <em>Psychological Bulletin</em> 142(2):198–229 (2016,
    <a href="https://doi.org/10.1037/bul0000025">doi:10.1037/bul0000025</a>).
    So the act of keeping this log is itself one of the things acting on you,
    and the tool cannot separate that from whatever your environment is doing.
    That is not a reason to avoid logging. It is a reason not to read a rising
    score as proof that the lamp you bought was the cause.</p>

    <p>Each finding shows both groups, how many entries are in each, the
    difference between them, and how fragile it is — the score one further
    entry would have to fall below for the finding to disappear. If a single
    additional evening would erase a finding, the tool says so on the finding
    itself.</p>

    <h2>What it is not</h2>
    <p>It is not a diagnostic instrument, not medical advice, and not
    evidence about anyone other than the person keeping the log. It compares
    your own entries with each other. That is the whole claim.</p>

    <p><a href="https://aloha-ai-consulting.vercel.app">Aloha AI Consulting</a>
    · <a href="https://rn-selected-work.vercel.app">RN Builds</a></p>

"use strict";
/* ============================================================
   Nervous System Studio — V1
   Single-file app. Client-side router + localStorage store.
   ============================================================ */

/* ---------- DATA MODEL ----------
   store schema (localStorage key: 'nss.v1'):
   {
     user: { id, name, email, createdAt } | null,
     waitlist: [ { email, createdAt } ],
     sensoryProfile: {              // one per user
        desiredStates:[], sensitivities:[], helpfulInputs:[],
        aesthetics:[], cannabisUse:'none|current|curious',
        cannabisGoals:[], productFormats:[], updatedAt
     } | null,
     environments: [ { id, name } ],   // reusable room presets (derived)
     routines: [ { id, name } ],
     products: [ { id, label, format } ],
     logs: [ { id, ...fields, scores:{...}, createdAt } ],
     insights: [ derived at runtime ],
     blueprints: derived at runtime
   }
--------------------------------------------------------------- */

const LS_KEY = 'nss.v1';
const uid = () => Math.random().toString(36).slice(2,9);

const DEFAULT_STATE = {
  user:null, waitlist:[], sensoryProfile:null,
  environments:[], routines:[], products:[], logs:[]
};

function load(){
  try{ const raw = localStorage.getItem(LS_KEY); return raw ? Object.assign({}, DEFAULT_STATE, JSON.parse(raw)) : structuredCloneSafe(DEFAULT_STATE); }
  catch(e){ return structuredCloneSafe(DEFAULT_STATE); }
}
function structuredCloneSafe(o){ return JSON.parse(JSON.stringify(o)); }
let STATE = load();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){ toast('Storage unavailable in this browser.'); } }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(()=>{ t.hidden = true; }, 2800);
}
function fmtDate(iso){
  try{
    // Parse date-only strings (YYYY-MM-DD) as LOCAL dates to avoid a UTC
    // off-by-one where e.g. "2026-07-18" renders as Jul 17 in negative-UTC zones.
    let d;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    if(m){ d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3])); }
    else { d = new Date(iso); }
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }catch(e){ return iso; }
}
function fmtTime(t){ return t || ''; }
function isLoggedIn(){ return !!STATE.user; }
function hasProfile(){ return !!STATE.sensoryProfile; }

/* Option vocabularies (shared across quiz + log) */
const OPT = {
  desiredStates: ['Calm','Focus','Creativity','Sleep support','Less overstimulation','Grounded / present'],
  sensitivities: ['Bright light','Loud or sudden sound','Visual clutter','Strong scents','Certain textures','Screens / blue light','Social intensity','Temperature'],
  helpfulInputs: ['Warm low light','Natural daylight','Soft ambient sound','Silence','Nature sounds','Calming scent','Soft textures','Tidy space','Warmth','Movement / stretching'],
  aesthetics: ['Warm minimal','Natural / earthy','Soft & cozy','Airy & bright','Muted & moody','Textured & tactile'],
  cannabisGoals: ['Wind down in the evening','Ease into creative work','Support sleep routine','Reduce overstimulation','Social ease','Simply curious / exploring'],
  productFormats: ['Flower','Vaporizer','Edible','Tincture','Beverage','Topical','Prefer not to say'],
  lighting: ['Warm','Neutral','Cool','Daylight','Candle / very warm'],
  brightness: ['Very dim','Dim','Moderate','Bright'],
  clutter: ['Very tidy','Tidy','Some clutter','High clutter'],
  sound: ['Silence','Soft ambient','Music','Nature sounds','Noisy / busy'],
  scent: ['None','Fresh / clean','Herbal','Floral','Woody / earthy','Strong'],
  texture: ['Soft','Smooth','Rough','Mixed','Not notable'],
  social: ['Alone','One other person','Small group','Busy / crowded'],
  screens: ['None','A little','Moderate','Heavy'],
  moods: ['Calm','Neutral','Tense','Anxious','Low','Energized','Scattered'],
  bodyStates: ['Relaxed','Restless','Tired','Tense','Achy','Energized','Neutral'],
  rooms: ['Bedroom','Living room','Home office','Kitchen','Outdoors','Studio','Other']
};

const SCORE_FIELDS = [
  {key:'calm', label:'Calm'},
  {key:'focus', label:'Focus'},
  {key:'creativity', label:'Creativity'},
  {key:'sleepSupport', label:'Sleep support'},
  {key:'anxiety', label:'Anxiety'},
  {key:'overstimulation', label:'Overstimulation'},
  {key:'bodyComfort', label:'Body comfort'}
];

/* Safety line reused across app */
const SAFETY_LINE = 'Nervous System Studio is a self-reflection tool for personal insight. It does not diagnose, treat, cure, or prevent any condition, and does not provide medical advice.';

/* ============================================================
   ROUTER
   ============================================================ */
const ROUTES = {}; // name -> render function returning HTML string
const APP_ROUTES = ['dashboard','add-log','journal','insights','blueprint']; // require login

function navigate(hash){ if(location.hash === hash){ render(); } else { location.hash = hash; } }
window.addEventListener('hashchange', render);

function currentRoute(){
  let h = location.hash.replace(/^#\/?/, '');
  const [path, query] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', parts, query:new URLSearchParams(query||'') };
}

const MARK = `<svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#f3e7dc" stroke="#d8ccb8"/><path d="M5 18c3.5 0 3.5-7 7-7s3.5 9 7 9 3.5-11 7-11" stroke="#7a4d30" stroke-width="1.8" stroke-linecap="round"/></svg>`;

function header(){

/* wire up dynamic behaviours after each render */
function afterRender(){
  // mobile menu
  const mb = document.getElementById('menuBtn');
  const nl = document.getElementById('navlinks');
  if(mb && nl){
    const isMobile = ()=> window.matchMedia('(max-width:860px)').matches;
    if(isMobile()) nl.hidden = true; else nl.hidden = false;
    mb.onclick = ()=>{ const open = nl.hidden; nl.hidden = !open; mb.setAttribute('aria-expanded', String(open)); };
    window.onresize = ()=>{ if(!isMobile()) nl.hidden=false; else if(mb.getAttribute('aria-expanded')!=='true') nl.hidden=true; };
  }
  // chips (multi/single select)
  document.querySelectorAll('.chip input').forEach(inp=>{
    const chip = inp.closest('.chip');
    chip.setAttribute('data-on', String(inp.checked));
    inp.addEventListener('change', ()=>{
      if(inp.type==='radio'){
        document.querySelectorAll(`.chip input[name="${CSS.escape(inp.name)}"]`).forEach(o=>o.closest('.chip').setAttribute('data-on', String(o.checked)));
      } else {
        chip.setAttribute('data-on', String(inp.checked));
      }
    });
  });
  // range live output
  document.querySelectorAll('input[type=range]').forEach(rg=>{
    const out = document.getElementById(rg.id+'-out');
    if(out){ const upd=()=> out.textContent = rg.value; rg.addEventListener('input', upd); upd(); }
  });
  // waitlist form
  const wf = document.getElementById('waitForm');
  if(wf){
    wf.addEventListener('submit', (e)=>{
      e.preventDefault();
      const email = document.getElementById('wl-email').value.trim();
      const err = document.getElementById('wl-email-err');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Please enter a valid email address.'; document.getElementById('wl-email').focus(); return; }
      err.textContent='';
      if(!STATE.waitlist.some(w=>w.email===email)) STATE.waitlist.push({email, createdAt:new Date().toISOString()});
      save();
      wf.closest('.narrow').querySelector('.card').innerHTML =
        `<div class="center" style="padding:8px"><div class="bp-ic" style="margin:0 auto 10px">${ICON.calm}</div><h3>You're on the list</h3><p class="muted small">Thanks — we'll reach out to <strong>${esc(email)}</strong> as beta spots open. In the meantime, you can start your Sensory Profile.</p><a class="btn btn-primary" href="#/sensory-profile">Take the Sensory Profile</a></div>`;
      toast('Added to the beta list.');
    });
  }
  // data tools (export / import / sample) — present on several routes
  const bindClick = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  bindClick('logExportJson', exportLogsJson);
  bindClick('logExportCsv', exportLogsCsv);
  bindClick('loadSample', loadSampleLogs);
  const imp = document.getElementById('logImport');
  if(imp) imp.onchange = (e)=>{ const f = e.target.files && e.target.files[0]; if(f) importLogsFromFile(f); e.target.value=''; };
  // account reset
  const rb = document.getElementById('resetBtn');
  if(rb){ rb.onclick = ()=>{
    if(confirm('Reset all preview data and sign out? This cannot be undone.')){
      STATE = structuredCloneSafe(DEFAULT_STATE); save(); toast('All data cleared.'); navigate('#/home');
    }
  }; }
  // scroll reveal (reduced-motion safe: CSS forces visible if reduced)
  const reveals = document.querySelectorAll('.reveal:not(.in)');
  if(reveals.length && 'IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
    reveals.forEach(el=>io.observe(el));
  } else {
    reveals.forEach(el=>el.classList.add('in'));
  }
  // run any page hook
  if(typeof window._pageHook === 'function'){ const h = window._pageHook; window._pageHook = null; h(); }
}

function wireContact(){
  const f = document.getElementById('contactForm');
  if(!f) return;
  f.addEventListener('submit',(e)=>{
    e.preventDefault();
    const email = document.getElementById('ct-email').value.trim();
    const err = document.getElementById('ct-email-err');
    const name = document.getElementById('ct-name').value.trim();
    const msg = document.getElementById('ct-msg').value.trim();
    if(!name){ toast('Please add your name.'); document.getElementById('ct-name').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Please enter a valid email address.'; document.getElementById('ct-email').focus(); return; }
    err.textContent='';
    if(!msg){ toast('Please add a short message.'); document.getElementById('ct-msg').focus(); return; }
    f.closest('.card').innerHTML = `<div class="center" style="padding:12px"><span class="medallion sage" style="margin:0 auto 12px">${ICON.check}</span><h2>Message ready to send</h2><p class="muted small">Thanks, ${esc(name)}. In this preview, messages aren't transmitted — but your note is captured here so nothing is lost. We'll follow up at <strong>${esc(email)}</strong> once messaging is live.</p><a class="btn btn-secondary" href="#/home">Back to home</a></div>`;
    toast('Message captured.');
  });
}

/* chip renderer */
function chip(name, label, checked, multi){
  const type = multi ? 'checkbox' : 'radio';
  return `<label class="chip"><input type="${type}" name="${esc(name)}" value="${esc(label)}"${checked?' checked':''}/><span>${esc(label)}</span><span class="tick" aria-hidden="true">✓</span></label>`;

let quizState = null;
function initQuiz(){
  const p = STATE.sensoryProfile;
  quizState = {
    step:0,
    data:{
      desiredStates: p? [...p.desiredStates]:[],
      sensitivities: p? [...p.sensitivities]:[],
      helpfulInputs: p? [...p.helpfulInputs]:[],
      aesthetics: p? [...p.aesthetics]:[],
      cannabisUse: p? p.cannabisUse:'',
      cannabisGoals: p? [...p.cannabisGoals]:[],
      productFormats: p? [...p.productFormats]:[]
    }
  };
}

function quizSteps(){
  const d = quizState.data;
  const steps = [
    { key:'desiredStates', legend:'Which states are you reaching for?',
      hint:'Choose all that feel true right now.', options:OPT.desiredStates, multi:true, required:true },
    { key:'sensitivities', legend:'What tends to overwhelm you?',
      hint:'Sensitivity sits on a spectrum, not a label — pick the inputs you find intense, draining, or hard to settle from.', options:OPT.sensitivities, multi:true, required:false },
    { key:'helpfulInputs', legend:'What helps you settle or focus?',
      hint:'Inputs that tend to feel supportive.', options:OPT.helpfulInputs, multi:true, required:false },
    { key:'aesthetics', legend:'Which aesthetics feel like you?',
      hint:'This shapes the tone of your blueprints.', options:OPT.aesthetics, multi:true, required:false },
    { key:'cannabisUse', legend:'Is cannabis part of your exploration?',
      hint:'Entirely optional. This never changes the core of your profile.',
      options:['No, not for me','I currently use cannabis','Curious / exploring'], multi:false, required:true, single:true }
  ];
  // conditional cannabis steps
  if(d.cannabisUse === 'I currently use cannabis' || d.cannabisUse === 'Curious / exploring'){
    steps.push({ key:'cannabisGoals', legend:'What are you hoping cannabis might support?',
      hint:'Personal goals only — not medical use.', options:OPT.cannabisGoals, multi:true, required:false });
    steps.push({ key:'productFormats', legend:'Which formats do you tend to reach for?',
      hint:'Helps you log faster later. Optional.', options:OPT.productFormats, multi:true, required:false });
  }
  return steps;
}

views['sensory-profile'] = () => {
  if(!quizState) initQuiz();
  const steps = quizSteps();
  const total = steps.length;
  if(quizState.step >= total){ return quizReview(); }
  const s = steps[quizState.step];
  const d = quizState.data;
  const pct = Math.round((quizState.step/total)*100);
  const selected = s.single ? [d[s.key]] : (d[s.key]||[]);
  const chips = s.options.map(o=>{
    const on = s.single ? d[s.key]===o : (d[s.key]||[]).includes(o);
    return chip('q_'+s.key, o, on, s.multi);
  }).join('');
  window._pageHook = ()=> wireQuizStep(s);
  return `
  <section class="section">
    <div class="narrow">
      <h1 class="visually-hidden">Sensory Profile quiz</h1>
      <div class="stepdots">Step ${quizState.step+1} of ${total} · Sensory Profile</div>
      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"><span style="width:${pct}%"></span></div>
      <fieldset>
        <legend style="font-family:var(--font);font-size:1.5rem;margin-bottom:6px">${esc(s.legend)}</legend>
        <p class="muted small" style="margin-top:-2px">${esc(s.hint)}${s.required?' <span aria-hidden="true">·</span> <span style="color:var(--clay-deep)">Required</span>':''}</p>
        <div class="choices" id="quizChoices">${chips}</div>
      </fieldset>
      <p id="quizErr" class="small" style="color:var(--danger);min-height:1.2em" role="alert"></p>
      <div style="display:flex; gap:12px; margin-top:8px">
        ${quizState.step>0? '<button class="btn btn-secondary" id="qBack" type="button">Back</button>':'<a class="btn btn-secondary" href="#/home">Cancel</a>'}
        <button class="btn btn-primary" id="qNext" type="button" style="flex:1">${quizState.step===total-1?'Review':'Continue'}</button>
      </div>
    </div>
  </section>`;
};

function wireQuizStep(s){
  const d = quizState.data;
  const collect = ()=>{
    const inputs = [...document.querySelectorAll('#quizChoices input')];
    if(s.single){ const c = inputs.find(i=>i.checked); d[s.key] = c? c.value : ''; }
    else { d[s.key] = inputs.filter(i=>i.checked).map(i=>i.value); }
  };
  const back = document.getElementById('qBack');
  if(back) back.onclick = ()=>{ collect(); quizState.step--; render(); };
  document.getElementById('qNext').onclick = ()=>{
    collect();
    const err = document.getElementById('quizErr');
    if(s.required){
      const empty = s.single ? !d[s.key] : (!d[s.key]||d[s.key].length===0);
      if(empty){ err.textContent = 'Please choose at least one option to continue.'; return; }
    }
    err.textContent='';
    quizState.step++; render();
  };
}

   All of it happens on this device: files are built with Blob and a
   local object URL, and an import is read with FileReader. No request.
   ============================================================ */
const LOG_FIELDS = ['date','time','desiredState','room','lighting','brightness','clutter','sound','scent','texture','social','screens','moodBefore','bodyBefore','usedProduct','notes'];

function downloadLocal(name, type, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportLogsJson(){
  downloadLocal('nervous-system-studio-logs.json','application/json', JSON.stringify({
    exportSchema:'nss-logs-v1',
    exportedAt:new Date().toISOString(),
    interpretation:{
      selfReported:true, associationsNotCauses:true,
      minimumLogsBeforeAnyInsight:NSS_MIN_LOGS, minimumEntriesPerComparedGroup:NSS_MIN_GROUP,
      minimumPointDifference:NSS_GAP, maximumInsightsShownAtOnce:NSS_MAX_INSIGHTS,
      confidenceGrades:'Moderate needs 5 per group and 12 total; Emerging needs 3 and 8; otherwise Preliminary',
      notDiagnostic:true, notAPhysiologicalMeasurement:true
    },
    sensoryProfile: STATE.sensoryProfile,
    logs: STATE.logs
  }, null, 2));
  toast('Logs exported to a file on this device.');
}
function exportLogsCsv(){
  const q = v => `"${String(v==null?'':v).replaceAll('"','""')}"`;
  const head = ['id',...LOG_FIELDS, ...SCORE_FIELDS.map(f=>f.key), 'createdAt'];
  const out = [head.map(q).join(',')];
  STATE.logs.forEach(l=>{
    out.push([l.id, ...LOG_FIELDS.map(k=>l[k]), ...SCORE_FIELDS.map(f=>l.scores? l.scores[f.key] : ''), l.createdAt].map(q).join(','));
  });
  out.push('');
  out.push(q('Self-reported ratings on a 0-10 scale. Associations only; nothing here is a measurement or a diagnosis.'));
  downloadLocal('nervous-system-studio-logs.csv','text/csv', out.join('\n'));
  toast('Logs exported as CSV.');
}
function validImportedLog(x){
  if(!x || typeof x !== 'object') return null;
  const str = (v,max=200)=> typeof v==='string' ? v.slice(0,max) : '';
  const scores = {};
  for(const f of SCORE_FIELDS){
    const v = x.scores ? Number(x.scores[f.key]) : NaN;
    if(!Number.isFinite(v) || v<0 || v>10) return null;
    scores[f.key] = Math.round(v);
  }
  const date = str(x.date,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  const out = { id:uid(), date, scores, usedProduct: x.usedProduct===true, product:null };
  for(const k of LOG_FIELDS) if(k!=='date' && k!=='usedProduct') out[k] = str(x[k], k==='notes'?1000:200);
  out.createdAt = Number.isFinite(Date.parse(x.createdAt)) ? new Date(x.createdAt).toISOString()
                : new Date(date + 'T' + (out.time||'12:00')).toISOString();
  return out;
}
function importLogsFromFile(file){
  const reader = new FileReader();
  reader.onerror = ()=> toast('That file could not be read.');
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(String(reader.result)); }
    catch(e){ toast('That file is not valid JSON. Nothing was imported.'); return; }
    const raw = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.logs) ? parsed.logs : null);
    if(!raw){ toast('No logs found in that file.'); return; }
    if(raw.length > 500){ toast('That file holds more than 500 entries and was refused.'); return; }
    let added = 0, dropped = 0;
    raw.forEach(x=>{ const l = validImportedLog(x); if(l){ STATE.logs.push(l); added++; } else dropped++; });
    save(); render();
    toast(`${added} ${added===1?'entry':'entries'} imported. ${dropped} discarded as invalid.`);
  };
  reader.readAsText(file);
}
