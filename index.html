/* ============================================================
   INSIGHTS ENGINE (rules-based)
   Compares average outcome scores across environment groupings.
   ============================================================ */
function avgFor(logs, key){ const v = logs.map(l=>l.scores[key]).filter(n=>typeof n==='number'); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }

/* ------------------------------------------------------------------
   Evidence-informed thresholds (see Research Dossier §4):
   - Require a minimum total sample and per-group sample before surfacing
     anything (guards against small-sample noise).
   - Require a meaningful average gap (guards against trivial differences).
   - Cap the number of surfaced patterns (guards against the
     multiple-comparisons problem — tracking many variables guarantees
     some spurious "findings").
   - Grade each pattern's confidence by how much data supports it, and
     always frame as association + hypothesis + a test to run (N-of-1).
   ------------------------------------------------------------------ */
const NSS_MIN_LOGS = 4;      // minimum total entries before any insight
const NSS_MIN_GROUP = 2;     // each compared group needs >= this many entries
const NSS_GAP = 1.5;         // minimum gap (0-10 scale) to be worth mentioning
const NSS_MAX_INSIGHTS = 4;  // cap simultaneous patterns (multiple comparisons)

function computeInsights(){
  const logs = STATE.logs;
  if(logs.length < NSS_MIN_LOGS) return [];

  // Compare the highest vs lowest group for a field/outcome, honoring min-group size.
  function groups(field, outcome){
    const g = {};
    logs.forEach(l=>{ const v=l[field]; if(!v) return; (g[v]=g[v]||[]).push(l); });
    const rows = Object.entries(g)
      .map(([v,ls])=>({v, n:ls.length, a:avgFor(ls,outcome)}))
      .filter(r=>r.a!=null && r.n>=NSS_MIN_GROUP);
    if(rows.length<2) return null;
    rows.sort((x,y)=>y.a-x.a);
    rows.field = field; rows.outcome = outcome;
    return rows;
  }
  // Confidence grade from the data supporting a comparison.
  function grade(topN, botN){
    const m = Math.min(topN, botN), tot = logs.length;
    if(m>=5 && tot>=12) return 'Moderate';
    if(m>=3 && tot>=8)  return 'Emerging';
    return 'Preliminary';
  }

  // Ordinal scales, ordered low -> high. A headline may only assert a direction
  // ("more X means more Y") when the top-scoring group really is the higher rung
  // of the scale; otherwise it must report what the data actually shows.
  const ORDINAL = { clutter: OPT.clutter, screens: OPT.screens, brightness: OPT.brightness };
  function rises(field, top, bot){
    const a = ORDINAL[field]; if(!a) return null;
    const i = a.indexOf(top), j = a.indexOf(bot);
    if(i < 0 || j < 0) return null;
    return i > j;
  }

  const cand = [];
  const add = (rows, spec)=>{
    if(!rows) return;
    const top=rows[0], bot=rows[rows.length-1];
    const gap = top.a - bot.a;
    if(gap < NSS_GAP) return;
    if(spec.excludeTop && spec.excludeTop.includes(top.v)) return;
    cand.push({
      tag: spec.tag,
      gap,
      confidence: grade(top.n, bot.n),
      n: top.n + bot.n,
      text: spec.text(top,bot),
      detail: spec.detail(top,bot),
      experiment: spec.experiment(top,bot),
      // the working, kept so the app can show it rather than assert it
      field: rows.field, outcome: rows.outcome,
      groupsCompared: rows.length, groupsSeen: rows.all || rows.length,
      top: {v:top.v, n:top.n, a:top.a}, bot: {v:bot.v, n:bot.n, a:bot.a},
      totalLogs: logs.length
    });
  };

  add(groups('lighting','calm'), {
    tag:'Calm',
    text:(t)=>`${t.v} lighting appears associated with your calmer entries.`,
    detail:(t,b)=>`Calm averaged ${t.a.toFixed(1)}/10 on ${lc(t.v)}-lit entries (${t.n}) versus ${b.a.toFixed(1)}/10 on ${lc(b.v)}-lit ones (${b.n}). This is a correlation in your logs, not a cause.`,
    experiment:(t)=>`For your next 3 evenings, deliberately set ${lc(t.v)} lighting and log your calm score. If it holds across repeats, the pattern is likely real for you.`
  });
  add(groups('clutter','overstimulation'), {
    tag:'Overstimulation',
    text:(t,b)=>{ const up = rises('clutter', t.v, b.v);
      return up === true  ? `More clutter may be associated with more overstimulation for you.`
           : up === false ? `Your tidier entries — not the cluttered ones — carry the higher overstimulation scores.`
           : `“${t.v}” spaces carry your highest overstimulation scores.`; },
    detail:(t,b)=>`Overstimulation averaged ${t.a.toFixed(1)}/10 in “${t.v}” spaces (${t.n}) versus ${b.a.toFixed(1)}/10 in “${b.v}” spaces (${b.n}). Other factors could explain this — treat it as a lead, not a verdict.`,
    experiment:(t,b)=>`Try clearing one surface before a few sessions in your usual space and log overstimulation. Compare the tidier runs to the cluttered ones.`
  });
  add(groups('sound','focus'), {
    tag:'Focus',
    text:(t)=>`Your higher-focus entries tend to involve ${lc(t.v)}.`,
    detail:(t,b)=>`Focus averaged ${t.a.toFixed(1)}/10 with ${lc(t.v)} (${t.n}) versus ${b.a.toFixed(1)}/10 with ${lc(b.v)} (${b.n}). A pattern to explore for deep work.`,
    experiment:(t)=>`Pick two focus blocks this week with ${lc(t.v)} and two without, keeping everything else similar, then compare your focus scores.`
  });
  add(groups('screens','anxiety'), {
    tag:'Anxiety',
    text:(t,b)=>{ const up = rises('screens', t.v, b.v);
      return up === true  ? `Heavier screen exposure may be associated with higher reported anxiety.`
           : up === false ? `Your lighter-screen entries — not the heavier ones — carry the higher anxiety scores.`
           : `“${t.v}” screen exposure carries your highest reported anxiety scores.`; },
    detail:(t,b)=>`Anxiety averaged ${t.a.toFixed(1)}/10 with “${t.v}” screen exposure (${t.n}) versus ${b.a.toFixed(1)}/10 with “${b.v}” (${b.n}). Direction and cause aren't established by this alone.`,
    experiment:()=>`Try a lighter-screen evening a few times and log anxiety, comparing against your heavier-screen entries.`
  });
  add(groups('lighting','sleepSupport'), {
    tag:'Sleep',
    text:(t)=>`${t.v} lighting appears associated with better sleep-support entries.`,
    detail:(t,b)=>`Sleep support averaged ${t.a.toFixed(1)}/10 with ${lc(t.v)} lighting (${t.n}) versus ${b.a.toFixed(1)}/10 with ${lc(b.v)} (${b.n}). Consistent with evening-light research, but this is your own pattern to test.`,
    experiment:(t)=>`Keep evening lighting ${lc(t.v)} and low for several nights and log sleep support; compare with brighter evenings.`
  });
  add(groups('sound','calm'), {
    tag:'Calm',
    text:(t)=>`${t.v} appears associated with your calmer entries.`,
    detail:(t,b)=>`Calm averaged ${t.a.toFixed(1)}/10 with ${lc(t.v)} (${t.n}) versus ${b.a.toFixed(1)}/10 with ${lc(b.v)} (${b.n}).`,
    experiment:(t)=>`Deliberately choose ${lc(t.v)} for a few sessions and log calm, comparing to sessions without it.`
  });

  // Cannabis set-and-setting pattern (only if enough product sessions)
  const prod = logs.filter(l=>l.usedProduct);
  if(prod.length>=NSS_MIN_LOGS){
    const busy = (l)=> ['Noisy / busy','Music'].includes(l.sound) || l.clutter==='High clutter' || l.brightness==='Bright';
    const hi = prod.filter(busy), lo = prod.filter(l=>!busy(l));
    if(hi.length>=NSS_MIN_GROUP && lo.length>=NSS_MIN_GROUP){
      const hiO = avgFor(hi,'overstimulation'), loO = avgFor(lo,'overstimulation');
      if(hiO!=null && loO!=null && (hiO-loO)>=NSS_GAP){
        cand.push({ tag:'Set & setting', gap:hiO-loO, confidence:grade(hi.length,lo.length), n:hi.length+lo.length,
          field:'setting (busier vs calmer)', outcome:'overstimulation', groupsCompared:2, groupsSeen:2,
          top:{v:'busier settings', n:hi.length, a:hiO}, bot:{v:'calmer settings', n:lo.length, a:loO},
          totalLogs: logs.length,
          text:`On product sessions, higher-stimulation settings may feel more intense for you.`,
          detail:`Overstimulation averaged ${hiO.toFixed(1)}/10 in busier settings (${hi.length}) versus ${loO.toFixed(1)}/10 in calmer ones (${lo.length}). This mirrors the general set-and-setting idea, but the research on environment and cannabis is mixed — treat it purely as your own reflection, not guidance.`,
          experiment:`If you choose to, compare a few calmer-setting sessions against busier ones and log overstimulation.` });
      }
    }
  }

  // Rank by effect size, then cap (multiple-comparisons guard).
  cand.sort((a,b)=> b.gap - a.gap);
  return cand.slice(0, NSS_MAX_INSIGHTS);
}
function lc(s){ return String(s||'').toLowerCase(); }
function confBadge(c){
  const map={Moderate:'sage', Emerging:'', Preliminary:''};
  return `<span class="badge${c==='Moderate'?'':' '}" style="background:${c==='Moderate'?'var(--sage-wash)':'var(--surface-2)'};color:${c==='Moderate'?'var(--sage-deep)':'var(--ink-soft)'}">${ICON.check} ${esc(c)} confidence</span>`;
}

/* ============================================================
   THE GUARDS, MADE INSPECTABLE
   Every threshold in computeInsights() is a published number with a
   reason. These helpers let the app show its working instead of
   asking to be trusted.
   ============================================================ */
const GUARD_FIELDS = [
  ['lighting','Lighting'],['brightness','Brightness'],['clutter','Clutter'],
  ['sound','Sound'],['scent','Scent'],['texture','Texture'],
  ['social','Social context'],['screens','Screen exposure'],['room','Room']
];
function readiness(){
  const logs = STATE.logs;
  const fields = GUARD_FIELDS.map(([key,label])=>{
    const g = {};
    logs.forEach(l=>{ const v = l[key]; if(v) g[v] = (g[v]||0)+1; });
    const values = Object.entries(g).sort((a,b)=>b[1]-a[1]);
    const usable = values.filter(([,n])=>n>=NSS_MIN_GROUP);
    return { key, label, values, usable, comparable: usable.length>=2 };
  });
  return {
    logs: logs.length,
    needed: Math.max(0, NSS_MIN_LOGS - logs.length),
    meets: logs.length >= NSS_MIN_LOGS,
    fields,
    comparable: fields.filter(f=>f.comparable),
    nearly: fields.filter(f=>!f.comparable && f.values.length>=2)
  };
}
/* The score a further entry in the top group would have to fall below for the
   gap to drop under the reporting floor — i.e. how fragile the observation is. */
function flipPoint(i){
  const x = (i.bot.a + NSS_GAP) * (i.top.n + 1) - i.top.a * i.top.n;
  if(!isFinite(x)) return null;
  if(x <= 0) return { kind:'none' };
  if(x > 10) return { kind:'any' };
  return { kind:'value', x };
}
function nextGrade(i){
  const m = Math.min(i.top.n, i.bot.n), tot = i.totalLogs;
  if(i.confidence==='Moderate') return null;
  if(i.confidence==='Emerging') return { label:'Moderate', group: Math.max(0,5-m), total: Math.max(0,12-tot) };
  return { label:'Emerging', group: Math.max(0,3-m), total: Math.max(0,8-tot) };
}
const FIELD_LABEL = {lighting:'Lighting colour',brightness:'Brightness',clutter:'Clutter',sound:'Sound',scent:'Scent',texture:'Texture',social:'Social context',screens:'Screen exposure',room:'Room'};
function fieldLabel(f){ return FIELD_LABEL[f] || String(f); }
function outcomeLabel(o){ const m = SCORE_FIELDS.find(x=>x.key===o); return m ? m.label.toLowerCase() : String(o); }
function insightWorking(i){
  const fp = flipPoint(i), ng = nextGrade(i);
  const gradeRule = i.confidence==='Moderate'
    ? `Both groups hold at least 5 entries and you have at least 12 in total, so this is graded Moderate — the highest grade this tool issues.`
    : i.confidence==='Emerging'
    ? `The smaller of the two groups holds ${Math.min(i.top.n,i.bot.n)} entries and you have ${i.totalLogs} in total, which meets the Emerging rule (3 per group, 8 overall) but not the Moderate one (5 per group, 12 overall).`
    : `The smaller of the two groups holds ${Math.min(i.top.n,i.bot.n)} ${Math.min(i.top.n,i.bot.n)===1?'entry':'entries'} and you have ${i.totalLogs} in total, below the Emerging rule of 3 per group and 8 overall — so this is graded Preliminary.`;
  const fragility = !fp ? ''
    : fp.kind==='none' ? `No single further entry could pull this under the ${NSS_GAP}-point floor; the difference is wider than one observation can undo.`
    : fp.kind==='any'  ? `One more “${esc(i.top.v)}” entry — at any score at all — would pull the difference under the ${NSS_GAP}-point floor and this observation would stop being shown. It is resting on very little.`
    : `One more “${esc(i.top.v)}” entry scoring below ${fp.x.toFixed(1)}/10 on ${esc(outcomeLabel(i.outcome))} would pull the difference under the ${NSS_GAP}-point floor, and this observation would stop being shown.`;
  const grow = !ng ? `This is already at the highest confidence grade the tool issues.`
    : (ng.group===0 && ng.total===0) ? `It would be graded ${ng.label} on the next recalculation.`
    : `To reach ${ng.label} it needs ${ng.group>0?`${ng.group} more ${ng.group===1?'entry':'entries'} in the smaller group`:'no more entries in the smaller group'}${ng.group>0&&ng.total>0?' and ':''}${ng.total>0?`${ng.total} more ${ng.total===1?'entry':'entries'} overall`:''}.`;
  return `
  <details class="working">
    <summary>How this was computed</summary>
    <div class="working-body">
      <p class="small mb-0"><strong>Comparison.</strong> ${esc(fieldLabel(i.field))} against your ${esc(outcomeLabel(i.outcome))} ratings, across ${i.groupsCompared} group${i.groupsCompared===1?'':'s'} that each met the ${NSS_MIN_GROUP}-entry minimum.</p>
      <div class="workwrap"><table class="work">
        <thead><tr><th scope="col">Group</th><th scope="col">Entries</th><th scope="col">Mean ${esc(outcomeLabel(i.outcome))}</th></tr></thead>
        <tbody>
          <tr><th scope="row">${esc(i.top.v)}</th><td>${i.top.n}</td><td>${i.top.a.toFixed(2)}/10</td></tr>
          <tr><th scope="row">${esc(i.bot.v)}</th><td>${i.bot.n}</td><td>${i.bot.a.toFixed(2)}/10</td></tr>
          <tr class="sum"><th scope="row">Difference</th><td>—</td><td>${i.gap.toFixed(2)} points</td></tr>
        </tbody>
      </table></div>
      <p class="small"><strong>Why it cleared the floor.</strong> ${i.gap.toFixed(2)} is above the ${NSS_GAP}-point minimum difference, so it was eligible to be shown. Differences smaller than that are discarded without being mentioned.</p>
      <p class="small"><strong>Why it is graded ${esc(i.confidence)}.</strong> ${gradeRule}</p>
      <p class="small"><strong>How fragile it is.</strong> ${fragility}</p>
      <p class="small mb-0"><strong>What would strengthen it.</strong> ${grow} <a href="#/method">How these thresholds were chosen &rarr;</a></p>
    </div>
  </details>`;
}

/* ============================================================
   METHOD — how an insight is made
   ============================================================ */
views.method = () => {
  const r = readiness();
  const rule = (n,t,b,src)=>`
    <div class="rulecard">
      <div class="rulenum">${n}</div>
      <div>
        <h3>${t}</h3>
        <p class="muted small">${b}</p>
        <p class="small faint mb-0">${src}</p>
      </div>
    </div>`;
  const status = `
    <div class="card">
      <p class="eyebrow">Your data, against these rules</p>
      <h3 style="margin-top:0">${r.logs} ${r.logs===1?'entry':'entries'} logged</h3>
      <p class="muted small">${
        r.meets
          ? `You are past the ${NSS_MIN_LOGS}-entry minimum, so comparisons can run.`
          : `${r.needed} more ${r.needed===1?'entry'
             :'entries'} and comparisons begin. Until then nothing is shown, however tempting the early numbers look.`}</p>
      ${r.comparable.length ? `
        <p class="small" style="margin-bottom:6px"><strong>Fields that can currently be compared</strong> — at least two of their values have reached ${NSS_MIN_GROUP} entries each:</p>
        <ul class="small muted" style="margin:0 0 12px;padding-left:1.15em">
          ${r.comparable.map(f=>`<li>${esc(f.label)} — ${f.usable.map(([v,n])=>`${esc(v)} (${n})`).join(', ')}</li>`).join('')}
        </ul>` : `<p class="small muted">No field yet has two values with ${NSS_MIN_GROUP} entries each, which is the other half of the requirement. Logging four entries in the same room under the same light produces no comparison at all.</p>`}
      ${r.nearly.length ? `
        <p class="small" style="margin-bottom:6px"><strong>Close, but not yet comparable</strong> — these have variety, but not enough repeats:</p>
        <ul class="small muted" style="margin:0;padding-left:1.15em">
          ${r.nearly.slice(0,4).map(f=>`<li>${esc(f.label)} — ${f.values.map(([v,n])=>`${esc(v)} (${n})`).join(', ')}</li>`).join('')}
        </ul>` : ''}
    </div>`;
  return `
  <section class="section tight">
    <div class="narrow">
      <p class="eyebrow">Method</p>
      <h1>How an insight is made — and why most of them never appear.</h1>
      <p class="lede">This tool reads self-reported logs and offers observations about your environment. That is one small step away from a horoscope, and the only thing separating them is a set of rules about when the tool is allowed to speak. Those rules are published here in full, with the numbers they actually use.</p>
      <p class="muted">Everything below runs on your device, over entries you wrote yourself. There is no model, no population comparison, and no inference about your body.</p>
    </div>
  </section>

  <section class="section-alt section">
    <div class="narrow">
      <p class="eyebrow">The five guards</p>
      <h2>What has to be true before a single sentence is shown.</h2>
      <p class="muted maxw-52" style="margin-bottom:20px">Each one exists because of a specific, documented way that self-tracking produces confident nonsense.</p>
      ${rule(NSS_MIN_LOGS,'A minimum of four entries in total','Below four entries there is no comparison to make — only noise wearing the shape of a pattern. Short series are dominated by whatever happened on the day, and an unusually bad first entry will be followed by a better one for purely statistical reasons, with nothing having changed.','Regression to the mean: Barnett, van der Pols &amp; Dobson (2004), <em>International Journal of Epidemiology</em>. <a href="https://doi.org/10.1093/ije/dyh299" target="_blank" rel="noopener">doi:10.1093/ije/dyh299</a>')}
      ${rule(NSS_MIN_GROUP,'A minimum of two entries in each group being compared','A comparison between “four entries with warm light” and “one entry with cool light” is not a comparison; it is a single evening given a label. Both sides of every comparison must have repeated at least once, or the comparison is dropped in silence.','A direct consequence of the same small-sample problem, applied per group rather than per dataset.')}
      ${rule(NSS_GAP,'A difference of at least 1.5 points on the 0–10 scale','Self-report drifts. The same room on two days can move a rating by a point without anything about the room changing. A floor of 1.5 points discards differences too small to survive that drift, which means the tool stays quiet about most of what it sees.','In-the-moment logging reduces recall bias but does not remove rating noise: Shiffman, Stone &amp; Hufford (2008), <em>Annual Review of Clinical Psychology</em>. <a href="https://doi.org/10.1146/annurev.clinpsy.3.022806.091415" target="_blank" rel="noopener">doi:10.1146/annurev.clinpsy.3.022806.091415</a>')}
      ${rule(NSS_MAX_INSIGHTS,'A hard cap of four observations at once','This is the most important guard and the least obvious. The tool checks many environment factors against many outcomes. Test enough pairs and some will clear any threshold by chance alone — that is arithmetic, not bad luck. Candidates are ranked by the size of the difference and everything past the fourth is thrown away.','The multiple-comparisons problem and the false-discovery framing that made it tractable: Benjamini &amp; Hochberg (1995), <em>Journal of the Royal Statistical Society Series B</em>. <a href="https://doi.org/10.1111/j.2517-6161.1995.tb02031.x" target="_blank" rel="noopener">doi:10.1111/j.2517-6161.1995.tb02031.x</a>')}
      ${rule('A–C','A confidence grade attached to every observation','Preliminary, Emerging, or Moderate — decided by how much data stands behind the specific comparison, not by how good the sentence sounds. Moderate needs at least 5 entries in each group and 12 overall. Emerging needs 3 and 8. Everything else is Preliminary, and Moderate is the highest grade this tool will ever issue.','Grades are a property of your dataset, not of the world. No observation here is evidence about anyone but you.')}
    </div>
  </section>

  <section class="section">
    <div class="narrow">
      <p class="eyebrow">Worked example</p>
      <h2>The same rules, run on nine entries.</h2>
      <p class="muted maxw-52">Suppose you have logged nine evenings, recording lighting each time and rating calm from 0 to 10.</p>
      <div class="card">
        <div class="workwrap"><table class="work">
          <thead><tr><th scope="col">Lighting</th><th scope="col">Entries</th><th scope="col">Calm ratings</th><th scope="col">Mean</th></tr></thead>
          <tbody>
            <tr><th scope="row">Warm</th><td>4</td><td>7, 8, 6, 8</td><td>7.25</td></tr>
            <tr><th scope="row">Neutral</th><td>3</td><td>6, 5, 7</td><td>6.00</td></tr>
            <tr><th scope="row">Candle / very warm</th><td>1</td><td>9</td><td>9.00</td></tr>
            <tr><th scope="row">Cool</th><td>1</td><td>3</td><td>3.00</td></tr>
          </tbody>
        </table></div>
        <ol class="muted small" style="margin:16px 0 0;padding-left:1.2em">
          <li><strong>Total entries:</strong> 9, which clears the minimum of ${NSS_MIN_LOGS}.</li>
          <li><strong>Groups dropped:</strong> “Candle” and “Cool” each hold one entry, below the ${NSS_MIN_GROUP}-entry minimum. Both are discarded — including the 9 and the 3, which are the two most interesting-looking numbers on the table. The comparison is between Warm and Neutral only.</li>
          <li><strong>Difference:</strong> 7.25 − 6.00 = 1.25 points.</li>
          <li><strong>Outcome:</strong> 1.25 is below the ${NSS_GAP}-point floor, so <strong>nothing is shown</strong>. Not a hedged version, not a “weak signal” — nothing.</li>
        </ol>
        <p class="small" style="margin:14px 0 0">A naive version of this tool would have reported “candlelight is your calmest setting” from a single evening rated 9. That sentence would have been the most satisfying output on the page and completely without support. Refusing to print it is the entire product.</p>
      </div>
      <p class="muted small" style="margin-top:14px">Change one thing — log a second candlelit evening rated 8 — and the picture shifts: Candle now holds 2 entries with a mean of 8.5, the comparison becomes Candle against Neutral, the difference is 2.5 points, and an observation appears, graded <em>Preliminary</em> because the smaller group holds 2 entries and the total is 10.</p>
    </div>
  </section>

  <section class="section-alt section">
    <div class="narrow">
      <p class="eyebrow">Where you are</p>
      <h2>Your own data against these rules.</h2>
      ${status}
      <p class="small faint" style="margin-top:12px">Entries are counted, never assessed. This panel says whether a comparison is arithmetically possible, not whether anything is wrong or right about how you feel.</p>
    </div>
  </section>

  <section class="section">
    <div class="narrow">
      <p class="eyebrow">The limit</p>
      <h2>What clearing every guard still does not buy you.</h2>
      <div class="card">
        <p class="muted small">An observation that survives all five rules is still a <strong>correlation in entries you wrote about yourself</strong>. It cannot tell you which way the arrow points — a calm evening is as able to produce a tidy room as a tidy room is to produce a calm evening. It cannot rule out a third thing causing both. And it cannot separate the effect of your environment from the effect of paying attention to your environment, which is what logging is.</p>
        <p class="muted small">The one route to a stronger personal statement is a within-person test: change a single input deliberately, repeat it several times, and compare against the occasions you did not. Formal single-case design standards ask for <strong>at least three demonstrations of an effect at three different points in time</strong> before a within-case result is treated as credible — which is why every observation here arrives with a small experiment attached rather than a conclusion.</p>
        <p class="small faint mb-0">What Works Clearinghouse, <em>Procedures and Standards Handbook, Version 5.0</em>, single-case design standards. <a href="https://ies.ed.gov/ncee/wwc/Docs/referenceresources/Final_WWC-HandbookVer5_0-0-508.pdf" target="_blank" rel="noopener">Read the handbook (PDF)</a>. On why recording at all changes behaviour: Harkin et al. (2016), <em>Psychological Bulletin</em>. <a href="https://doi.org/10.1037/bul0000025" target="_blank" rel="noopener">doi:10.1037/bul0000025</a></p>
      </div>
      <p class="small" style="margin-top:18px"><a href="#/research">The evidence behind the recommendations &rarr;</a> · <a href="#/insights">See your own patterns &rarr;</a> · <a href="#/disclaimer">Safety &amp; legal &rarr;</a></p>
    </div>
  </section>
`;
};

views.insights = () => {
  const logs = STATE.logs;
  const ins = computeInsights();
  const remaining = Math.max(0, NSS_MIN_LOGS - logs.length);
  if(logs.length < NSS_MIN_LOGS){
    return `
    <section class="section tight"><div class="narrow">
      <p class="eyebrow">Insights</p><h1>Patterns to explore</h1>
      <div class="empty">
        <div class="em-ic">${ICON.focus}</div>
        <h2>${logs.length===0?'No entries yet':`${logs.length} ${logs.length===1?'entry':'entries'} so far`}</h2>
        <p class="muted small" style="max-width:52ch;margin:0 auto 16px">To surface a pattern responsibly, we wait until you have at least <strong>${NSS_MIN_LOGS} entries</strong> across a few different settings — small samples produce false patterns. ${remaining>0?`About <strong>${remaining} more</strong> to go.`:''}</p>
        <a class="btn btn-primary" href="#/add-log">Add a log</a>
      </div>
      <div class="card" style="margin-top:16px;background:var(--surface-2)">
        <p class="small mb-0">Why the wait? Insights here are grounded in self-tracking research: a handful of days is a tiny, noisy sample, and comparing many factors at once can invent patterns that aren't there. We'd rather show you fewer, sturdier observations. <a href="#/method">See exactly how an insight is made &rarr;</a></p>
      </div>
    </div></section>`;
  }
  const body = ins.length ? ins.map(i=>`
    <div class="card">
      <div class="flex items-center" style="gap:10px;flex-wrap:wrap;margin-bottom:6px">
        <span class="pill">${esc(i.tag)}</span>
        ${confBadge(i.confidence)}
        <span class="small faint">${i.n} entries compared</span>
      </div>
      <p style="font-family:var(--serif);font-size:1.28rem;line-height:1.34;letter-spacing:-.01em;margin:4px 0 8px">${esc(i.text)}</p>
      <p class="muted small" style="margin:0 0 14px">${esc(i.detail)}</p>
      <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px">
        <p class="eyebrow" style="margin:0 0 4px">Test it — a small experiment</p>
        <p class="small mb-0">${esc(i.experiment)}</p>
      </div>
      ${insightWorking(i)}
    </div>`).join('') : `
    <div class="empty">
      <div class="em-ic">${ICON.focus}</div>
      <h2>No strong patterns yet</h2>
      <p class="muted small" style="max-width:52ch;margin:0 auto 12px">Your entries so far don't show a difference large or consistent enough to call out responsibly. That's a feature, not a bug — most comparisons should end here.</p>
      <p class="muted small" style="max-width:52ch;margin:0 auto 12px">Usually it is one of two things. Either both sides of a comparison haven't repeated yet — a factor needs at least ${NSS_MIN_GROUP} entries at each of two different values before it can be compared at all — or the differences that exist are under the ${NSS_GAP}-point floor.</p>
      ${readiness().comparable.length ? `<p class="muted small" style="max-width:52ch;margin:0 auto 12px">Comparable right now: ${readiness().comparable.map(f=>esc(f.label)).join(', ')}. The differences within them are simply too small so far.</p>` : `<p class="muted small" style="max-width:52ch;margin:0 auto 12px">Nothing is comparable yet: no factor has two values with ${NSS_MIN_GROUP} entries each. Varying one thing deliberately — the lighting, the sound — does more than logging more of the same.</p>`}
      <a class="btn btn-secondary" href="#/method">See what has to be true for a pattern to appear</a>
    </div>`;
  return `
  <section class="section tight"><div class="narrow">
    <p class="eyebrow">Insights · from ${logs.length} entries</p>
    <h1>Patterns to explore</h1>
    <p class="lede">These describe <strong>associations</strong> in your own self-reports — what tended to co-occur, not what caused what. Each one is a hypothesis with a small experiment to test it.</p>
    <div class="guardstrip">
      <div><span class="gn">${NSS_MIN_LOGS}</span><span class="gl">entries minimum</span><span class="gd">before anything is compared</span></div>
      <div><span class="gn">${NSS_MIN_GROUP}</span><span class="gl">per group minimum</span><span class="gd">both sides must repeat</span></div>
      <div><span class="gn">${NSS_GAP}</span><span class="gl">point difference floor</span><span class="gd">smaller gaps are discarded</span></div>
      <div><span class="gn">${NSS_MAX_INSIGHTS}</span><span class="gl">maximum shown at once</span><span class="gd">guards against chance hits</span></div>
    </div>
    <p class="small" style="margin:-4px 0 20px">${ins.length? `${ins.length} observation${ins.length===1?'':'s'} cleared all four rules out of everything checked. Open <em>How this was computed</em> on any card to see the groups, the means and the arithmetic.`:'Nothing cleared all four rules, so nothing is shown.'} <a href="#/method">Why these numbers &rarr;</a></p>
    ${body}
    <div class="card" style="background:var(--surface-2)">
      <p class="eyebrow" style="margin:0 0 6px">How to read these honestly</p>
      <ul class="muted small" style="margin:0;padding-left:1.1em">
        <li style="margin-bottom:6px">These are <strong>your self-reports</strong>. The act of tracking can itself shift what you notice — so treat logs as a sketch, not a measurement.</li>
        <li style="margin-bottom:6px"><strong>Correlation isn't cause.</strong> A hidden factor (mood, sleep, the day itself) could explain a pattern. The way to find out is to test it.</li>
        <li style="margin-bottom:0">A great day often follows a bad one on its own (<em>regression to the mean</em>). Repeating an experiment several times is what separates signal from rebound.</li>
      </ul>
    </div>
    <p class="muted small">${esc(SAFETY_LINE)} <a href="#/research">See the evidence behind this &rarr;</a></p>
  </div></section>`;
};

/* ============================================================
   MY BLUEPRINT
   ============================================================ */
function bestValue(field, outcome, fallback){
  const logs = STATE.logs;
  const groups = {};
  logs.forEach(l=>{ const v=l[field]; if(!v) return; (groups[v]=groups[v]||[]).push(l); });
  const rows = Object.entries(groups).map(([v,ls])=>({v,a:avgFor(ls,outcome)})).filter(r=>r.a!=null);
  if(!rows.length) return null;
  rows.sort((x,y)=>y.a-x.a);
  return rows[0].v;
}

function buildBlueprints(){
  const p = STATE.sensoryProfile || {aesthetics:[],helpfulInputs:[],sensitivities:[],cannabisUse:'',cannabisGoals:[]};
  const hasData = STATE.logs.length>=2;
  const cannabis = (p.cannabisUse==='I currently use cannabis' || p.cannabisUse==='Curious / exploring');
  const aesthetic = p.aesthetics[0] || 'warm, natural';

  // pull personalized bests where available, else sensible defaults
  const calmLight = (hasData && bestValue('lighting','calm')) || 'Warm';
  const focusSound = (hasData && bestValue('sound','focus')) || 'Silence';
  const sleepLight = (hasData && bestValue('lighting','sleepSupport')) || 'Candle / very warm';
  const calmScent = (hasData && bestValue('scent','calm')) || 'Woody / earthy';
  const createScent = (hasData && bestValue('scent','creativity')) || 'Fresh / clean';

  const note = (personalized)=> personalized && hasData ? ' <span class="pill" style="background:var(--sage-deep);color:#fff;border-color:var(--sage-deep)">from your logs</span>' : '';
  // Evidence tags per guidance row (see Research Dossier). Rows are [label, html, evidence].
  const WELL='Well-supported', MIX='Mixed evidence', PREF='Personal preference';

  return [
    { id:'calm', icon:ICON.calm, title:'Calm Blueprint',
      intro:'A setting that may support settling and downshifting.',
      rows:[
        ['Lighting', `${calmLight} and low in the evening. Reducing light intensity late lowers alerting signals to the circadian system — one of the better-supported environmental levers.${note(hasData && bestValue('lighting','calm'))}`, WELL],
        ['Sound', 'Silence, soft ambient sound, or self-chosen music. Music has some of the most consistent evidence for reducing anxiety; sudden or busy audio tends to do the opposite.', WELL],
        ['Decor / clutter', 'Keep surfaces clear. Cluttered spaces have been correlated with higher stress in some studies, though cause isn\'t established — worth testing for yourself.', MIX],
        ['Scent', `${calmScent} or none, kept gentle. Scent–calm links are real for some people but heavily shaped by personal association, so treat this as preference, not medicine.${note(hasData && bestValue('scent','calm'))}`, PREF],
        ['Color direction', `Muted earth tones — clay, sand, soft olive — matching your ${lc(aesthetic)} preference. Chosen for aesthetic comfort; broad "calming color" claims aren\'t well supported.`, PREF],
        ['Texture', 'Soft, warm textures you can sink into — a blanket, a worn cushion. A comfort choice.', PREF],
        ['Routine', 'A short, consistent wind-down: dim the lights, put screens away, one slow activity in the same order. Consistency itself is a well-supported habit lever.', WELL],
      ],
      cannabis: cannabis ? 'If cannabis is part of your evening, you can log it alongside your setting and watch your own calm scores. Note: the research on whether environment shapes the cannabis experience is mixed, so treat this purely as self-reflection — not medical guidance, dosing, or a way to guarantee a calm experience.' : null,
      avoid:['Bright or cool light in the last hour','Loud or sudden sound','Heavy screen time right before','Comparing yourself on an off day'],
      experiment:'Run a small test: for 3–4 evenings, keep lighting warm and low; on other evenings, don\'t. Log calm each time and compare the two sets. Repeating it is what turns a hunch into something real.' },

    { id:'focus', icon:ICON.focus, title:'Focus Blueprint',
      intro:'A setting that may support sustained attention.',
      rows:[
        ['Lighting', 'Brighter, cooler or natural daylight while you work — daytime light exposure is reasonably well linked to alertness. Avoid glare.', WELL],
        ['Sound', `${focusSound}. ${hasData && bestValue('sound','focus')?'This came from your own logs. ':'Test silence versus soft ambient and keep what helps. '}Chronic background noise reliably impairs concentration, so protecting your soundscape matters.${note(hasData && bestValue('sound','focus'))}`, WELL],
        ['Decor / clutter', 'Low clutter in your field of view; clear the desk to one task. Competing visual input draws on limited attention (lab evidence); the real-world size is uncertain, so test it.', MIX],
        ['Routine', 'A clear start ritual, a single focus block, notifications silenced. Monitoring one clear goal is among the best-supported behavior levers.', WELL],
        ['Scent', 'Fresh, clean, or none — nothing heavy or sedating. A preference lever, not a proven cognitive booster.', PREF],
        ['Color direction', 'Low-distraction palette with one small accent. Aesthetic comfort; "color boosts focus" claims are weak.', PREF],
        ['Texture', 'Firm, supportive seating; minimal fidget surfaces. A comfort choice.', PREF],
      ],
      cannabis: cannabis ? 'Cannabis affects concentration differently for different people and can hinder it. If you explore it, log honestly and let your own focus scores speak. This is not a recommendation or endorsement.' : null,
      avoid:['High clutter','Busy or noisy background','Frequent screen switching','Multitasking'],
      experiment:'Pick two focus blocks with your candidate setup and two without, keeping the task similar, then compare focus scores across the four. More repeats, more confidence.' },

    { id:'sleep', icon:ICON.sleep, title:'Sleep Blueprint',
      intro:'A supportive evening environment — not a treatment for sleep problems.',
      rows:[
        ['Lighting', `${sleepLight}. Keep light warm and as low as is comfortable in the hours before bed; light sensitivity varies a lot between people, so find your own level. Evening-light effects on the body clock are well established.${note(hasData && bestValue('lighting','sleepSupport'))}`, WELL],
        ['Darkness', 'Make the sleep space as dark as feasible. Even modest light during sleep has been shown to affect overnight physiology — a well-supported reason to dim and cover light sources.', WELL],
        ['Temperature', 'Keep the room on the cool side. A cool, comfortable bedroom supports sleep; heat above your comfort zone tends to fragment it.', WELL],
        ['Sound', 'Quiet, or steady soft sound. Nighttime noise fragments sleep even when you don\'t fully wake, so lowering it is worthwhile.', WELL],
        ['Routine', 'Most supported of all: keep sleep and wake times consistent, with a calm, screen-light wind-down. Regular timing is strongly linked to better outcomes in large studies.', WELL],
        ['Scent', 'Subtle and familiar, or none. A comfort preference, not a sleep aid.', PREF],
        ['Texture', 'Comfortable bedding and soft, warm layers. A comfort choice.', PREF],
      ],
      cannabis: cannabis ? 'Some people include cannabis in an evening routine; effects on sleep vary between people and can change over time. Observe your own sleep-support scores if you wish, but this is not a sleep aid, treatment, or medical claim.' : null,
      avoid:['Bright or cool light late','A light or warm sleep space','Stimulating sound or content','Irregular bed/wake times'],
      experiment:'For several nights, keep the room dark, cool, and your bedtime consistent; note sleep support. Compare with your less-consistent nights. If sleep problems persist, please talk with a qualified professional.' },

    { id:'creative', icon:ICON.creative, title:'Creative Blueprint',
      intro:'A setting that may support open, playful thinking.',
      rows:[
        ['Lighting', 'Warm and comfortable, with some natural light if you can. Soft, not harsh — a comfort-led choice.', PREF],
        ['Sound', 'Whatever loosens you — soft music or ambient sound. Music\'s mood effects are reasonably supported; test what opens you up.', MIX],
        ['Decor / clutter', 'A little curated texture can feel inspiring; keep it from tipping into overwhelm. (The popular "mess boosts creativity" study failed to replicate, so trust your own experience over the myth.)', MIX],
        ['Routine', 'A low-pressure warm-up, then protected, unstructured making time. Reducing interruptions is the dependable part.', MIX],
        ['Scent', `${createScent} or a scent you link with ease. Personal association matters more than any universal effect.${note(hasData && bestValue('scent','creativity'))}`, PREF],
        ['Color direction', `Textured, characterful tones in your ${lc(aesthetic)} direction. An aesthetic choice to enjoy.`, PREF],
        ['Texture', 'Varied, tactile materials within reach. Comfortable but not sleepy.', PREF],
      ],
      cannabis: cannabis ? 'If cannabis is part of your creative practice, your set and setting still shape the experience. Log the environment alongside it and let your own creativity scores surface what fits. Personal exploration only — not advice.' : null,
      avoid:['Harsh lighting','Rigid, sterile spaces','Constant interruptions','Pressure to perform'],
      experiment:'Try your candidate setup for a few short, judgment-free making sessions and skip it for a few others; compare your creativity scores across both.' },
  ];
}

views.blueprint = () => {
  const bps = buildBlueprints();
  const hasData = STATE.logs.length>=2;
  window._pageHook = ()=>{
    const tabs = [...document.querySelectorAll('.tab')];
    const panels = [...document.querySelectorAll('[role=tabpanel]')];
    tabs.forEach(t=> t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.setAttribute('aria-selected','false'));
      panels.forEach(pn=> pn.hidden = true);
      t.setAttribute('aria-selected','true');
      document.getElementById(t.getAttribute('aria-controls')).hidden = false;
    }));
    // keyboard arrow support
    tabs.forEach((t,i)=> t.addEventListener('keydown',(e)=>{
      let n=null; if(e.key==='ArrowRight') n=tabs[(i+1)%tabs.length]; if(e.key==='ArrowLeft') n=tabs[(i-1+tabs.length)%tabs.length];
      if(n){ e.preventDefault(); n.focus(); n.click(); }
    }));
  };
  const tabBtns = bps.map((b,i)=>`<button class="tab" role="tab" id="tab-${b.id}" aria-controls="panel-${b.id}" aria-selected="${i===0}">${esc(b.title.replace(' Blueprint',''))}</button>`).join('');
  const panels = bps.map((b,i)=>`
    <div role="tabpanel" id="panel-${b.id}" aria-labelledby="tab-${b.id}" ${i===0?'':'hidden'}>
      <div class="card">
        <div class="blueprint-h"><span class="bp-ic">${b.icon}</span><h2 style="margin:0">${esc(b.title)}</h2></div>
        <p class="muted">${esc(b.intro)}</p>
        <dl class="bp">
          ${b.rows.map(([k,v,ev])=>`<dt>${esc(k)}${ev?' '+evTag(ev):''}</dt><dd>${v}</dd>`).join('')}
          ${b.cannabis? `<dt>Optional cannabis context</dt><dd class="muted">${esc(b.cannabis)}</dd>`:''}
          <dt class="avoid">Avoid list</dt><dd><ul style="margin:2px 0 0;padding-left:1.1em">${b.avoid.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></dd>
          <dt>Next experiment <span class="pill" style="background:var(--clay-wash);border-color:var(--line);color:var(--clay-deep)">N-of-1</span></dt><dd><strong>${esc(b.experiment)}</strong></dd>
        </dl>
      </div>
    </div>`).join('');
  return `
  <section class="section tight"><div class="narrow">
    <p class="eyebrow">My Blueprint</p>
    <h1>Supportive environments, tuned to you</h1>
    <p class="lede">Four blueprints drawn from your Sensory Profile${hasData?' and your logs':''}. Each element is tagged by how strong the general evidence is — so you know which levers to trust and which to simply try.</p>
    <div class="flex wrap-gap" style="gap:8px;margin:14px 0 4px">
      ${evTag('Well-supported')} ${evTag('Mixed evidence')} ${evTag('Personal preference')}
    </div>
    <p class="small faint" style="margin:2px 0 18px">These are supportive-environment suggestions for self-reflection — not prescriptions, treatment, or medical advice. Each blueprint ends with a small within-person (N-of-1) test, the honest way to learn what actually works for you.</p>
    ${hasData?'':`<div class="card" style="background:var(--surface-2)"><p class="small" style="margin:0">These start from your profile and general evidence. Add a few logs and your blueprints will personalize to what <em>you reported</em>. <a href="#/add-log">Add a log &rarr;</a></p></div>`}
    <div class="tabs" role="tablist" aria-label="Blueprints">${tabBtns}</div>
    ${panels}
    <p class="muted small">${esc(SAFETY_LINE)} <a href="#/research">See the evidence &rarr;</a></p>
  </div></section>`;
};
function evTag(kind){
  const m = {
    'Well-supported':['var(--sage-wash)','var(--sage-deep)'],
    'Mixed evidence':['#f4ecdd','#8a6d2f'],
    'Personal preference':['var(--surface-2)','var(--ink-soft)']
  };
  const c = m[kind] || m['Personal preference'];
  return `<span class="badge" style="background:${c[0]};color:${c[1]};border-color:var(--line);font-size:.72rem">${esc(kind)}</span>`;
}

if(!location.hash) location.hash = '#/home';
render();
</script>
